<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinbowl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6F0EA; --card:#F8FCF9; --ink:#16324F; --muted:#557083; --grid:#A7C1B3;
  --mark:#C62E2E; --lane:#C98A2B; --laneInk:#2B1B05; --ok:#2F7A4D; --warn:#A5401F; --me:#FFF1D6;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0F1D19;--card:#172A24;--ink:#E2EEE7;--muted:#93AFA3;--grid:#32514A;--mark:#FF6F61;--lane:#E2A94B;--laneInk:#1E1403;--ok:#6BD197;--warn:#FF9A73;--me:#3A2F16;}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
a{color:inherit}

.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);padding:.6rem 1rem .4rem}
.bar{display:flex;align-items:center;gap:.7rem;max-width:1100px;margin:0 auto}
.bar h1{font:400 1.7rem/1 var(--display)}
.bar select{flex:1;min-width:0;background:transparent;color:var(--paper);border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);border-radius:6px;padding:.35rem .5rem;font-weight:600}
.bar select option{color:#16324F;background:#fff}
.linkbtn{background:none;border:0;color:var(--lane);font-weight:600;cursor:pointer;padding:.3rem;white-space:nowrap}
nav{display:flex;gap:.2rem;overflow-x:auto;max-width:1100px;margin:.5rem auto 0;scrollbar-width:none}
nav button{background:none;border:0;color:inherit;opacity:.72;padding:.45rem .75rem;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;font-weight:600}
nav button[aria-selected="true"]{opacity:1;background:var(--paper);color:var(--ink)}

.banner{max-width:1100px;margin:1rem auto 0;padding:0 1rem}
.banner div{background:var(--me);border:1px solid var(--lane);border-radius:8px;padding:.6rem .9rem;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:1.1rem 1rem 4rem}
.panel{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:1.1rem;margin-bottom:1rem}
.panel h2{font:700 1.35rem/1.2 var(--cond);margin-bottom:.6rem}
.panel h3{font:700 1.1rem/1.2 var(--cond);margin:1.1rem 0 .4rem}
.panel p+p{margin-top:.6rem}
.note{color:var(--muted);font-size:.93rem;max-width:70ch}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.grow{flex:1 1 14rem}
label{display:block;font-weight:600;font-size:.92rem;margin:.8rem 0 .3rem}
label.check{display:flex;gap:.5rem;align-items:flex-start;font-weight:500}
label.check input{margin-top:.3rem}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:.55rem .65rem;border:1px solid var(--grid);border-radius:6px;background:var(--paper)}
.btn{border:1px solid var(--ink);background:transparent;padding:.5rem .9rem;border-radius:6px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--lane);border-color:var(--lane);color:var(--laneInk);font-size:1.05rem;padding:.7rem 1.4rem}
.btn.small{padding:.2rem .55rem;font-size:.85rem}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--warn);font-weight:600}
.good{color:var(--ok);font-weight:600}

.two{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.panel,.two>*{min-width:0}

.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
.choice{text-align:left;border:1px solid var(--grid);background:var(--paper);border-radius:8px;padding:.55rem .7rem;cursor:pointer}
.choice b{display:block;font:700 1.05rem/1.2 var(--cond)}
.choice small{color:var(--muted)}
.choice[aria-pressed="true"]{border:2px solid var(--ink);background:var(--card)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.balls{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.balls .choice{text-align:center}
.slot{margin-top:.5rem;font-weight:600;color:var(--ok)}
.slot.warn{color:var(--warn)}
.preview{margin:1rem 0;padding:.75rem;border-left:4px solid var(--lane);background:var(--paper);border-radius:0 6px 6px 0;min-height:3rem}
.preview .big{font:400 1.4rem/1.2 var(--display);color:var(--mark)}

/* scoresheet */
.card-scroll{overflow-x:auto;padding-bottom:.25rem}
.sheet{display:grid;grid-template-columns:repeat(calc(var(--n) - 1),minmax(2.5rem,1fr)) minmax(3.8rem,1.4fr) minmax(3.8rem,1.3fr);border:2px solid var(--ink);border-radius:4px;min-width:33rem;background:var(--card)}
.fr{border-right:1px solid var(--grid);display:flex;flex-direction:column}
.fr:last-child{border-right:0}
.fn{font:600 .72rem/1.4 var(--cond);text-align:center;color:var(--muted);border-bottom:1px solid var(--grid)}
.rolls{display:flex;justify-content:flex-end;height:1.55rem}
.rolls i{font:700 1rem/1.55rem var(--cond);font-style:normal;width:1.35rem;text-align:center;border-left:1px solid var(--grid);border-bottom:1px solid var(--grid)}
.mk{color:var(--mark)}
.cum{font:700 1.15rem/1.9rem var(--cond);text-align:center;min-height:1.9rem}
.cum.pend{color:var(--muted);font-weight:500}
.tot .big{font:400 1.4rem/3.4rem var(--display);text-align:center}

/* frame list */
.flist{list-style:none;padding:0;margin:.8rem 0 0}
.fl{display:grid;grid-template-columns:2rem 1fr auto auto;gap:.2rem .7rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--grid)}
.fno{font:400 1.05rem/1 var(--display);color:var(--lane);text-align:center}
.fmid b{font:700 1.05rem/1.2 var(--cond);display:block}
.fmid small{color:var(--muted);display:block;line-height:1.35}
.fmk{text-align:center;min-width:3.5rem}
.fmk span{display:block;font:700 1.35rem/1 var(--cond);letter-spacing:.08em}
.fmk small{color:var(--muted);font-size:.78rem}
.fpt{text-align:right;min-width:3.6rem}
.fpt span{display:block;font:700 1.35rem/1 var(--cond)}
.fpt small{color:var(--muted);font-size:.78rem}
.facts{grid-column:2 / -1;display:flex;gap:.35rem;flex-wrap:wrap}
.fl.dim{opacity:.55}

/* standings */
.stand{padding:0;overflow:hidden}
.stand summary{list-style:none;display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;cursor:pointer}
.stand summary::-webkit-details-marker{display:none}
.stand.me summary{background:var(--me)}
.rank{font:400 1.25rem/1 var(--display);color:var(--lane);min-width:2rem;text-align:center}
.pname{flex:1;font:700 1.2rem/1.2 var(--cond)}
.pname small{display:block;font:500 .85rem var(--body);color:var(--muted)}
.ptotal{font:400 1.5rem/1 var(--display)}
.stand .inner{padding:0 1rem 1rem}

/* machines */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.mcard h3{margin:0 0 .15rem}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.7rem 0}
.mstats div{background:var(--ink);color:var(--paper);border-radius:8px;padding:.45rem .6rem}
.mstats small{display:block;font-size:.75rem;opacity:.8}
.mstats b{font:400 1.15rem/1.2 var(--display)}
.brackets{list-style:none;padding:0;margin:.3rem 0 0;font-variant-numeric:tabular-nums}
.brackets li{display:flex;justify-content:space-between;gap:.5rem;padding:.12rem 0;border-bottom:1px dashed var(--grid);font-size:.95rem}
.brackets li b{font-family:var(--cond);font-size:1.02rem}
.brackets li.hit b{color:var(--mark)}
.tag{font:600 .78rem var(--cond);background:var(--paper);border:1px solid var(--grid);border-radius:4px;padding:0 .35rem;white-space:nowrap}

table{border-collapse:collapse;width:100%}
th,td{padding:.4rem .5rem;border-bottom:1px solid var(--grid);text-align:left;vertical-align:middle}
th{font:600 .9rem var(--cond);color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem;margin-top:.8rem}
.pick button{padding:.8rem;border:1px solid var(--grid);background:var(--paper);border-radius:8px;font:700 1.1rem var(--cond);cursor:pointer;text-align:left}
.example{background:var(--paper);border-radius:8px;padding:.8rem;margin:.6rem 0}
.example .sheet{min-width:0}
pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem;background:var(--paper);padding:.6rem;border-radius:6px;max-height:20rem;overflow:auto}

#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(160%);background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:8px;font-weight:600;transition:transform .25s;max-width:92vw;z-index:10}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>Pinbowl</h1>
    <select id="tsel" aria-label="Tournament"></select>
    <button class="linkbtn" id="acct">Admin</button>
  </div>
  <nav id="nav" role="tablist" aria-label="Sections"></nav>
</header>
<div class="banner" id="banner"></div>
<main id="main"><div class="panel">Loading…</div></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= basics ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if(v===null||v===undefined||v==='') return null; const n=parseInt(String(v).replace(/[^\d]/g,''),10); return isNaN(n)?null:n; };
const fmt = n => n==null ? '' : Number(n).toLocaleString('en-US');
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3400); }

async function api(path, method='GET', body){
  const r = await fetch(path, {method, headers: body?{'Content-Type':'application/json'}:{}, body: body?JSON.stringify(body):undefined, credentials:'same-origin'});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error) || `Error ${r.status}`);
  return j;
}
// run an admin change; the server sends back the updated tournament
async function change(path, method, body, okMsg){
  try{ const j=await api(`/api/admin/t/${T.id}${path}`, method, body); if(j.tournament) T=j.tournament; if(okMsg) toast(okMsg); render(); return j; }
  catch(e){ toast(e.message); return null; }
}

/* ================= state ================= */
let ADMIN=null, LIST=[], T=null, NEEDS_SETUP=false, tab=null, screen=null, adminSettings=null;
const SPARE_LAST_BALL = 3;
const P = id => T.players.find(p=>p.id===id);
const A = id => T.arenas.find(a=>a.id===id);
const readOnly = () => T && T.status==='archived';
const myName = () => store.get('pb-me');
const me = () => { const n=myName(); return n && T ? T.players.find(p=>p.name.toLowerCase()===n.toLowerCase()) : null; };

/* ================= scoring ================= */
// each 10% of the target is one pin, starting at 0, capped at 9 (10 only comes from a strike or spare)
function pins(score, target){ if(score==null || !target) return 0; return Math.max(0, Math.min(9, Math.floor(score*10/target))); }
function gameRolls(g){
  const a=A(g.arenaId), t=a?a.target:0;
  if(g.hitBall===1) return {type:'strike', rolls:[10]};
  const first=pins(g.b1,t);
  if(g.hitBall>=2 && g.hitBall<=SPARE_LAST_BALL) return {type:'spare', rolls:[first,10-first]};
  const total=Math.max(first, pins(g.final,t));
  return {type:'open', rolls:[first,total-first]};
}
function scorePlayer(pid){
  const N=T.frames;
  const all=T.games.filter(g=>g.playerId===pid).map(g=>({g,...gameRolls(g)}));
  const reg=all.slice(0,N), extra=all.slice(N), rolls=all.flatMap(f=>f.rolls);
  let idx=0, run=0, ok=true; const frames=[];
  reg.forEach((f,k)=>{
    const own=f.rolls.length;
    let need=f.type==='strike'?2:f.type==='spare'?1:0;
    if(k===N-1 && !T.tenthBonus) need=0;
    const nxt=rolls.slice(idx+own, idx+own+need);
    const base=f.type==='open' ? f.rolls[0]+f.rolls[1] : 10;
    const pts=base+nxt.reduce((a,b)=>a+b,0), resolved=nxt.length===need;
    run+=pts; ok=ok&&resolved;
    frames.push({...f, pts, base, resolved, cum:run, showCum:ok, need});
    idx+=own;
  });
  const bonusNeed = (reg.length===N && T.tenthBonus) ? frames[N-1].need : 0;
  let used=0,c=0; for(const f of extra){ if(c>=bonusNeed) break; used++; c+=f.rolls.length; }
  const bonus=extra.slice(0,used), unused=extra.slice(used);
  const bonusRolls=bonus.flatMap(f=>f.rolls).slice(0,bonusNeed);
  const stillNeeded=Math.max(0, bonusNeed-bonusRolls.length);
  return {pid, frames, bonus, unused, bonusRolls, total:run, complete: reg.length===N && frames.every(f=>f.resolved), regCount:reg.length, stillNeeded};
}
function nextSlot(pid){
  const r=scorePlayer(pid);
  if(r.regCount<T.frames) return {kind:'frame', n:r.regCount+1};
  if(r.stillNeeded>0) return {kind:'bonus'};
  return {kind:'done'};
}
function symbols(rolls){
  const out=[]; let start=true, prev=0;
  for(const r of rolls){
    if(start){ if(r===10) out.push('X'); else { out.push(r?String(r):'–'); start=false; prev=r; } }
    else { out.push(prev+r===10?'/':(r?String(r):'–')); start=true; }
  }
  return out;
}
function standings(){
  const rows=T.players.map(p=>({p, r:scorePlayer(p.id)})).sort((a,b)=>b.r.total-a.r.total || a.p.name.localeCompare(b.p.name));
  let rank=0, last=null; rows.forEach((x,i)=>{ if(x.r.total!==last){ rank=i+1; last=x.r.total; } x.rank=rank; });
  return rows;
}

/* ================= shared pieces ================= */
function sheetHTML(r){
  const N=T.frames; let h=`<div class="card-scroll"><div class="sheet" style="--n:${N}">`;
  for(let k=0;k<N;k++){
    const f=r.frames[k], last=k===N-1; let cells=[];
    if(f) cells = last ? symbols(f.rolls.concat(r.bonusRolls)) : (f.type==='strike' ? ['','X'] : symbols(f.rolls));
    const slots = last ? (T.tenthBonus?3:2) : 2;
    while(cells.length<slots) cells.unshift('');
    const a=f?A(f.g.arenaId):null;
    h+=`<div class="fr" title="${a?esc(a.name):''}"><div class="fn">${k+1}</div><div class="rolls">${cells.map(c=>`<i class="${c==='X'||c==='/'?'mk':''}">${c}</i>`).join('')}</div><div class="cum ${f&&!f.showCum?'pend':''}">${f?(f.showCum?f.cum:'…'):''}</div></div>`;
  }
  return h+`<div class="fr tot"><div class="fn">Total</div><div class="big">${r.total}</div></div></div></div>`;
}
function scoreText(g){
  const parts=[];
  if(g.hitBall===1) parts.push('Target on ball 1'); else parts.push(`Ball 1: ${fmt(g.b1)}`);
  if(g.hitBall>=2) parts.push(`target on ball ${g.hitBall}`);
  if(g.final!=null) parts.push(`final: ${fmt(g.final)}`);
  return parts.join(', ');
}
function frameListHTML(r, admin){
  const rows=[];
  r.frames.forEach((f,k)=>rows.push({f, label:String(k+1), kind:'frame'}));
  r.bonus.forEach(f=>rows.push({f, label:'B', kind:'bonus'}));
  r.unused.forEach(f=>rows.push({f, label:'–', kind:'unused'}));
  if(!rows.length) return '<p class="note" style="margin-top:.6rem">No games played yet.</p>';
  const all = T.games.filter(g=>g.playerId===r.pid);
  return `<ul class="flist">${rows.map(({f,label,kind})=>{
    const a=A(f.g.arenaId), sy=f.type==='strike'?['X']:symbols(f.rolls);
    const what = f.type==='strike'?'Strike':f.type==='spare'?'Spare':`${f.rolls[0]+f.rolls[1]} pins`;
    let pts='', sub='';
    if(kind==='frame'){ pts = f.resolved ? f.pts : `${f.pts}…`; sub = f.showCum ? `total ${f.cum}` : (f.resolved?'':'waiting on bonus'); }
    else if(kind==='bonus'){ pts='bonus'; sub=`for frame ${T.frames}`; }
    else { pts='—'; sub='not counted'; }
    const i=all.findIndex(g=>g.id===f.g.id);
    const acts = admin && !readOnly() ? `<div class="facts">
      <button class="btn small" data-edit="${f.g.id}">Edit</button>
      <button class="btn small" data-move="${f.g.id}" data-dir="-1" ${i===0?'disabled':''} aria-label="Move earlier">Earlier</button>
      <button class="btn small" data-move="${f.g.id}" data-dir="1" ${i===all.length-1?'disabled':''} aria-label="Move later">Later</button>
      <button class="btn small danger" data-del="${f.g.id}">Delete</button></div>` : '';
    return `<li class="fl ${kind==='unused'?'dim':''}"><span class="fno">${label}</span>
      <div class="fmid"><b>${esc(a?a.name:'Removed machine')}</b><small>${esc(scoreText(f.g))}</small></div>
      <div class="fmk"><span>${sy.map(s=>`<em class="${s==='X'||s==='/'?'mk':''}" style="font-style:normal">${s}</em>`).join(' ')}</span><small>${what}</small></div>
      <div class="fpt"><span>${pts}</span><small>${sub}</small></div>${acts}</li>`;
  }).join('')}</ul>`;
}
function bindGameActions(root){
  root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ const g=T.games.find(x=>x.id===b.dataset.edit);
    Object.assign(F,{playerId:g.playerId, arenaId:g.arenaId, hitBall:g.hitBall, b1:g.b1!=null?fmt(g.b1):'', final:g.final!=null?fmt(g.final):'', editingId:g.id}); go('enter'); window.scrollTo(0,0); });
  root.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>change(`/games/${b.dataset.move}/move`,'POST',{dir:Number(b.dataset.dir)}));
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this game? This cannot be undone.')) change(`/games/${b.dataset.del}`,'DELETE',null,'Game deleted'); });
}
function brackets(a){
  const t=a.target; if(!t) return '<p class="note">Target score not set yet.</p>';
  const li=[`<li class="hit"><b>Strike</b><span>target on ball 1</span></li>`, `<li class="hit"><b>Spare</b><span>target on ball 2 or 3</span></li>`];
  for(let n=9;n>=0;n--){
    const lo=Math.ceil(n*t/10), hi=n===9?t-1:Math.ceil((n+1)*t/10)-1;
    const range = n===9 && a.balls===5 ? `${fmt(lo)} or more` : `${fmt(lo)}–${fmt(hi)}`;
    li.push(`<li><b>${n} pin${n===1?'':'s'}</b><span>${range}</span></li>`);
  }
  return `<ul class="brackets">${li.join('')}</ul>`;
}

/* ================= header, nav, routing ================= */
const PLAYER_TABS=[['mine','My card'],['standings','Standings'],['machines','Machines'],['rules','Rules']];
const ADMIN_TABS=[['enter','Enter score'],['standings','Standings'],['machines','Machines'],['players','Players'],['tournaments','Tournaments'],['totals','Matchplay totals'],['admins','Admins'],['rules','Rules']];
function tabs(){ return ADMIN ? ADMIN_TABS : PLAYER_TABS; }
function go(t){ tab=t; screen=null; store.set('pb-tab-'+(ADMIN?'a':'p'), t); render(); }

function renderHeader(){
  const sel=$('#tsel');
  sel.innerHTML = LIST.length ? LIST.map(t=>`<option value="${t.id}" ${T&&t.id===T.id?'selected':''}>${esc(t.name)}${t.status==='archived'?' (archived)':''}</option>`).join('') : '<option>No tournaments yet</option>';
  sel.disabled=!LIST.length;
  $('#acct').textContent = ADMIN ? 'Log out' : 'Admin';
  $('#nav').innerHTML = screen ? '' : tabs().map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${l}</button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  $('#banner').innerHTML = T && readOnly() ? '<div>This tournament is archived. Scores are read-only.</div>' : '';
}
function render(){
  renderHeader();
  if(screen==='setup') return renderSetupScreen();
  if(screen==='login') return renderLogin();

function renderRules(){

  <h2>How pinbowl works</h2>
  <p>Each game you play is one frame of bowling. Your card has ${T.frames} frames, and you can play the machines in any order${T.allowRepeats?'':', one game per machine'}. Your score is added up just like real bowling, so the best possible card is 300.</p>
  <p>Every machine has a target score. Check the Machines tab to see each target and exactly what score earns each pin count.</p>

  <h3>Strike, spare, or pins</h3>

  <p><b class="mk">Spare (/):</b> reach the target on ball 2 or ball 3.</p>
  <p><b>Pins:</b> if you don't reach the target by ball 3, you get 1 pin for every 10% of the target you reach, from 0 up to 9 pins. Your score after ball 1 counts as your first ball, and your final score counts as your whole frame.</p>
  <div class="example"><b>Example on ${esc(a.name)}</b>, target ${fmt(t)}:<br>
  After ball 1 you have ${fmt(pctScore(26))}. That's 26% of the target, so your first ball knocks down <b>2 pins</b>.<br>

  If you had reached ${fmt(t)} on ball 2 or 3 instead, your card would show <b>2 /</b>, a spare.</div>

  <h3>Bonus points carry over</h3>

  <div class="example"><b>Strike, then an open frame.</b> Frame 1 is a strike. In frame 2 you get 3 pins on ball 1 and 7 pins total. The strike earns 10 plus the next two balls (3 + 4), so frame 1 is worth 17. Frame 2 adds 7, for 24.

  <div class="example"><b>Spare, then an open frame.</b> Frame 1 is a spare. In frame 2 you get 6 pins on ball 1. The spare earns 10 plus the next ball (6), so frame 1 is worth 16.

  <h3>The last frame</h3>

  <h3>Scores</h3>

  $('#saveBtn').onclick=saveGame;

function validate(){
  if(!F.playerId) return {err:'Choose a player.'};
  if(!F.arenaId) return {err:'Choose a machine.'};
  const a=A(F.arenaId);
  if(!a.target) return {err:`Set a target score for ${a.name} on the Machines tab.`};
  if(!F.editingId){
    const slot=nextSlot(F.playerId);
    if(slot.kind==='done') return {err:`${P(F.playerId).name} has finished their card.`};
    const regular=T.games.filter(g=>g.playerId===F.playerId).slice(0,T.frames);
    if(slot.kind==='frame' && !T.allowRepeats && regular.some(g=>g.arenaId===F.arenaId)) return {err:`${P(F.playerId).name} already played ${a.name}.`};
  }
  if(F.hitBall===null) return {err:'Pick the ball the target was reached on.'};
  const b1=num(F.b1), fin=num(F.final), g={playerId:F.playerId, arenaId:F.arenaId, hitBall:F.hitBall, b1, final:fin};
  if(b1!=null && fin!=null && fin<b1) return {err:'The final score is lower than the ball 1 score.'};
  if(F.hitBall===1){
    if(b1!=null && b1<a.target) return {err:'The ball 1 score is below the target, so this is not a strike.'};
    return {g, text:'<span class="big">X</span><br>Strike: 10 pins plus the next two balls.'};
  }
  if(b1==null) return {err:'Enter the score after ball 1.'};
  if(b1>=a.target) return {err:'The ball 1 score reaches the target. That is a strike, so pick Ball 1.'};
  const first=pins(b1,a.target), pct=v=>Math.min(100,Math.floor(v*100/a.target));
  if(F.hitBall>=2){
    if(fin!=null && fin<a.target) return {err:'The final score is below the target, so this is not a spare.'};
    return {g, text:`<span class="big">${first||'–'} /</span><br>${first} pins on ball 1 (${pct(b1)}% of target), then a spare: 10 plus the next ball.`};
  }
  if(fin==null) return {err:'Enter the final score.'};
  if(a.balls===3 && fin>=a.target) return {err:'The final score reaches the target. Pick the ball it was reached on.'};
  const tot=Math.max(first,pins(fin,a.target));
  return {g, text:`<span class="big">${first||'–'} ${tot-first||'–'}</span><br>${first} pins on ball 1 (${pct(b1)}%), ${tot} pins for the game (${pct(fin)}%).`};
}

    <p class="note">Create the tournament in Matchplay first, then paste its link here. Players and machines come over automatically.</p>
    <label for="nmp">Matchplay tournament link or ID</label><input type="text" id="nmp" placeholder="https://app.matchplay.events/tournaments/123456">
    <label for="nname">Name (optional, Matchplay's name is used if blank)</label><input type="text" id="nname">
    ${LIST.length?'<label class="check"><input type="checkbox" id="ncopy" checked> Copy machines, targets and rules from the latest tournament</label>':''}
    <div class="row" style="margin-top:.8rem"><button class="btn primary" id="ngo">Create tournament</button></div></div>

  ${cur?`<div class="panel"><h2>${esc(cur.name)}</h2>
    ${readOnly()?`<p>This tournament is archived. Players can still view it, but nobody can change scores.</p>
      <div class="row" style="margin-top:.8rem"><button class="btn" id="reopen">Reopen tournament</button><button class="btn danger" id="tdel">Delete tournament</button></div>`:`
    <label for="tname">Name</label><input type="text" id="tname" value="${esc(cur.name)}">
    <label for="tmp">Matchplay tournament link or ID</label><input type="text" id="tmp" value="${cur.mpId||''}">
    <label for="tfr">Frames per player</label><input type="number" id="tfr" min="1" max="20" value="${cur.frames}" style="max-width:7rem">
    <label class="check"><input type="checkbox" id="ttb" ${cur.tenthBonus?'checked':''}> A strike or spare in the last frame earns bonus games</label>
    <label class="check"><input type="checkbox" id="trp" ${cur.allowRepeats?'checked':''}> Players may play the same machine more than once</label>
    <div class="row" style="margin-top:.8rem"><button class="btn" id="tsave">Save settings</button><button class="btn danger" id="tarch">Archive tournament</button></div>
    <p class="note" style="margin-top:.5rem">Archive when the event ends. It stays viewable, scores lock, and Matchplay checks stop.</p>`}
    ${cur.mpId?`<details style="margin-top:1rem"><summary class="note">Matchplay data check</summary><p class="note">Shows what Matchplay sent last time, which helps if target scores aren't coming through.</p><pre id="raw">Loading…</pre></details>`:''}
  </div>`:''}

  <div class="panel"><h2>All tournaments</h2><div class="tablewrap"><table><tbody>
    ${LIST.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.status==='archived'?'Archived':'Open'}</td><td class="n">${t.players} players</td><td class="n">${cur&&t.id===cur.id?'<span class="tag">Showing</span>':`<button class="btn small" data-open="${t.id}">Open</button>`}</td></tr>`).join('') || '<tr><td class="note">None yet.</td></tr>'}
  </tbody></table></div></div>

  <div class="panel"><h2>Matchplay connection</h2>
    <p class="note">${adminSettings.hasToken?'<span class="good">An API token is saved.</span> Paste a new one to replace it.':'Create a token in Matchplay under Account settings, API tokens, and paste it here.'} The token stays on the server and is never shown to players.</p>
    <div class="row" style="margin-top:.4rem"><div class="grow"><input type="password" id="tok" placeholder="Matchplay API token" autocomplete="off"></div><button class="btn" id="tokGo">Save token</button></div></div>`;

  $('#ngo').onclick=async()=>{
    try{ const j=await api('/api/admin/tournaments','POST',{mp:$('#nmp').value, name:$('#nname').value, copyMachines: $('#ncopy')?$('#ncopy').checked:false});
      T=j.tournament; store.set('pb-tid',T.id); await refreshList(); toast(j.note?`Created. ${j.note}`:'Tournament created'); go('machines'); }
    catch(e){ toast(e.message); } };
  $('#tokGo').onclick=async()=>{ try{ await api('/api/admin/settings','PUT',{mpToken:$('#tok').value}); adminSettings=null; toast('Token saved'); renderTournaments(); }catch(e){ toast(e.message); } };
  $$('[data-open]').forEach(b=>b.onclick=async()=>{ await loadT(b.dataset.open); resetForm(false); render(); });
  if(!cur) return;
  if(readOnly()){
    $('#reopen').onclick=async()=>{ if(confirm('Reopen this tournament so scores can be changed?')){ await change('','PATCH',{status:'active'},'Reopened'); await refreshList(); render(); } };
    $('#tdel').onclick=async()=>{ if(prompt('Type DELETE to permanently delete this tournament and all its scores.')==='DELETE'){ try{ await api(`/api/admin/t/${cur.id}`,'DELETE'); store.del('pb-tid'); await boot(); toast('Deleted'); }catch(e){ toast(e.message); } } };
  } else {
    $('#tsave').onclick=async()=>{ await change('','PATCH',{name:$('#tname').value, mp:$('#tmp').value, frames:Number($('#tfr').value), tenthBonus:$('#ttb').checked, allowRepeats:$('#trp').checked},'Settings saved'); await refreshList(); render(); };
    $('#tarch').onclick=async()=>{ if(confirm('Archive this tournament? Scores will be locked.')){ await change('','PATCH',{status:'archived'},'Archived'); await refreshList(); render(); } };
  }
  if($('#raw')) api(`/api/admin/t/${cur.id}/raw`).then(j=>{ const el=$('#raw'); if(el) el.textContent=Object.keys(j).length?JSON.stringify(j,null,2):'Nothing fetched yet.'; }).catch(()=>{});
}

/* ================= admin: totals ================= */
function renderTotals(){
  const N=T.frames, rows=standings();
  const pts=r=>Array.from({length:N},(_,k)=>r.frames[k]?r.frames[k].pts:'');
  $('#main').innerHTML=`<div class="panel"><h2>Totals for Matchplay</h2>
    <p class="note">Matchplay's API is read-only, so these can't be sent back automatically. In a Matchplay pinbowling tournament, type each frame's points into the matching frame. Bonuses are already included, so Matchplay's total will match.</p>
    ${T.mpId?`<p style="margin-top:.5rem"><a href="https://app.matchplay.events/tournaments/${T.mpId}" target="_blank" rel="noopener">Open this tournament in Matchplay</a></p>`:''}
    <div class="row" style="margin:.7rem 0"><button class="btn" id="cpAll">Copy all totals</button><button class="btn" id="csv">Download CSV</button></div>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th>${Array.from({length:N},(_,k)=>`<th class="n">${k+1}</th>`).join('')}<th class="n">Total</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.p.name)}${x.r.complete?'':' <span class="tag">in progress</span>'}</td>${pts(x.r).map((v,k)=>`<td class="n">${v===''?'':(x.r.frames[k].resolved?v:v+'…')}</td>`).join('')}<td class="n"><b>${x.r.total}</b></td><td><button class="btn small" data-cp="${x.p.id}">Copy</button></td></tr>`).join('')}
    </tbody></table></div><p class="note">A “…” means the frame is still waiting on bonus balls.</p></div>`;
  const copy=async txt=>{ try{ await navigator.clipboard.writeText(txt); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } toast('Copied'); };
  $('#cpAll').onclick=()=>copy(rows.map(x=>`${x.p.name}\t${x.r.total}`).join('\n'));
  $$('[data-cp]').forEach(b=>b.onclick=()=>copy(pts(rows.find(x=>x.p.id===b.dataset.cp).r).join('\t')));
  $('#csv').onclick=()=>{ const q=s=>`"${String(s).replace(/"/g,'""')}"`;
    const lines=[['Place','Player','Matchplay player ID',...Array.from({length:N},(_,k)=>`Frame ${k+1}`),'Total','Complete'].map(q).join(',')]
      .concat(rows.map(x=>[x.rank,x.p.name,x.p.mpId??'',...pts(x.r),x.r.total,x.r.complete?'yes':'no'].map(q).join(',')));
    const blob=new Blob([lines.join('\n')],{type:'text/csv'}), u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=`${T.name.replace(/[^\w-]+/g,'-')}-totals.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); };
}

/* ================= admin: admins ================= */
async function renderAdmins(){
  try{ adminSettings=await api('/api/admin/settings'); }catch(e){ toast(e.message); return; }
  $('#main').innerHTML=`<div class="panel"><h2>Admins</h2>
    <p class="note">Admins can enter and edit scores, manage machines and players, and run tournaments. Players never need a login.</p>
    <div class="tablewrap" style="margin-top:.6rem"><table><tbody>
    ${adminSettings.admins.map(a=>`<tr><td>${esc(a.name)}${a.id===ADMIN.id?' <span class="tag">you</span>':''}</td><td class="n">${a.id===ADMIN.id?'':`<button class="btn small" data-pw="${a.id}">Reset password</button> <button class="btn small danger" data-rmadm="${a.id}">Remove</button>`}</td></tr>`).join('')}
    </tbody></table></div>
    <h3>Add an admin</h3>
    <p class="note">Give them the name and password below. They can change the password after logging in.</p>
    <div class="row"><div class="grow"><label for="an">Name</label><input type="text" id="an" list="pnames"></div><div class="grow"><label for="ap">Temporary password</label><input type="text" id="ap" autocomplete="off"></div><button class="btn" id="aGo">Add admin</button></div>
    <datalist id="pnames">${(T?T.players:[]).map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
    <h3>Change my password</h3>
    <div class="row"><div class="grow"><input type="password" id="mypw" placeholder="New password" autocomplete="new-password"></div><button class="btn" id="mypwGo">Change password</button></div></div>`;
  $('#aGo').onclick=async()=>{ try{ await api('/api/admin/admins','POST',{name:$('#an').value,password:$('#ap').value}); toast('Admin added'); renderAdmins(); }catch(e){ toast(e.message); } };
  $('#mypwGo').onclick=async()=>{ try{ await api(`/api/admin/admins/${ADMIN.id}/password`,'PUT',{password:$('#mypw').value}); toast('Password changed'); $('#mypw').value=''; }catch(e){ toast(e.message); } };
  $$('[data-rmadm]').forEach(b=>b.onclick=async()=>{ if(!confirm('Remove this admin?')) return; try{ await api(`/api/admin/admins/${b.dataset.rmadm}`,'DELETE'); toast('Admin removed'); renderAdmins(); }catch(e){ toast(e.message); } });
  $$('[data-pw]').forEach(b=>b.onclick=async()=>{ const pw=prompt('New password for this admin (6 or more characters):'); if(!pw) return; try{ await api(`/api/admin/admins/${b.dataset.pw}/password`,'PUT',{password:pw}); toast('Password reset'); }catch(e){ toast(e.message); } });
}

/* ================= loading and live updates ================= */
async function refreshList(){ const s=await api('/api/state'); LIST=s.tournaments; ADMIN=s.admin; NEEDS_SETUP=s.needsSetup; }
async function loadT(id){ try{ T=await api('/api/t/'+id); store.set('pb-tid',id); }catch(e){ T=null; } }
async function boot(){
  try{ await refreshList(); }catch(e){ $('#main').innerHTML='<div class="panel err">Could not reach the server. Check your connection and reload.</div>'; return; }
  if(NEEDS_SETUP){ screen='setup'; render(); return; }
  const saved=store.get('pb-tid');
  const pickId = (LIST.find(t=>t.id===saved) || LIST.find(t=>t.status==='active') || LIST[0] || {}).id;
  T=null; if(pickId) await loadT(pickId);
  const valid=tabs().map(x=>x[0]);
  if(!valid.includes(tab)){ const s=store.get('pb-tab-'+(ADMIN?'a':'p')); tab=valid.includes(s)?s:valid[0]; }
  render();
}
setInterval(async()=>{
  if(document.hidden || screen || !T || T.status!=='active') return;
  try{
    const fresh=await api('/api/t/'+T.id); const changed=JSON.stringify(fresh)!==JSON.stringify(T);
    T=fresh; if(ADMIN) await refreshList();
    const typing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
    const openDetails=$$('details[open]').map(d=>d.dataset.pid||'');
    if(changed && !typing && !(tab==='enter' && formDirty()) && tab!=='tournaments' && tab!=='admins'){
      const y=window.scrollY; render(); $$('details[data-pid]').forEach(d=>{ d.open=openDetails.includes(d.dataset.pid); }); window.scrollTo(0,y);
    }
  }catch(e){}
}, 20000);
boot();
</script>

</html>
