<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinbowl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Graduate&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script>
// Colors: Northstar (default), Classic or Dark. A link can force one with ?theme=
(function(){var t=new URLSearchParams(location.search).get('theme');try{if(!t)t=localStorage.getItem('pb-theme')}catch(e){}
if(['northstar','classic','dark'].indexOf(t)<0)t='northstar';document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Northstar: colors from the Northstar Pinball Collective logo (default) */
:root,:root[data-theme="northstar"]{
  --paper:#EAF1F7; --card:#FFFFFF; --ink:#17120F; --muted:#56636E; --grid:#C3D2DD;
  --mark:#C2461A; --lane:#DE7A22; --laneInk:#17120F; --ok:#2C7A4B; --warn:#B03A12; --me:#FFE7CF;
  --head:#17120F; --headInk:#FFFFFF; --tagbg:#DCEBF6; --sky:#A9CFE8; --bar:#DE7A22;
  --stripeA:#DE7A22; --stripeB:#B8461B; --stripeW:4px;
  --display:"Graduate","Bowlby One","Arial Black",Impact,sans-serif;
}
/* Classic: the original green and navy look */
:root[data-theme="classic"]{
  --paper:#E6F0EA; --card:#F8FCF9; --ink:#16324F; --muted:#557083; --grid:#A7C1B3;
  --mark:#C62E2E; --lane:#C98A2B; --laneInk:#2B1B05; --ok:#2F7A4D; --warn:#A5401F; --me:#FFF1D6;
  --head:#16324F; --headInk:#E6F0EA; --tagbg:#DCE9E1; --sky:#A7C1B3; --bar:#B57A22;
  --stripeA:transparent; --stripeB:transparent; --stripeW:0px;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
}
/* Dark: Northstar colors on black */
:root[data-theme="dark"]{
  --paper:#0E0B09; --card:#1B1613; --ink:#F3ECE5; --muted:#A99B8F; --grid:#3B312A;
  --mark:#FF7B42; --lane:#F0912C; --laneInk:#17120F; --ok:#6BD197; --warn:#FF8F66; --me:#3B2A17;
  --head:#050403; --headInk:#FFFFFF; --tagbg:#22303B; --sky:#A9CFE8; --bar:#D9731C;
  --stripeA:#F0912C; --stripeB:#B8461B; --stripeW:4px;
  --display:"Graduate","Bowlby One","Arial Black",Impact,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
a{color:inherit}

.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--headInk);padding:.6rem 1rem .4rem;border-top:var(--stripeW) solid var(--stripeA);box-shadow:inset 0 3px 0 var(--stripeB)}
.bar{display:flex;align-items:center;gap:.45rem;max-width:1100px;margin:0 auto}
.bar h1{font:400 1.7rem/1 var(--display)}
:root:not([data-theme="classic"]) .bar h1{font-size:1.32rem;letter-spacing:.01em;background:linear-gradient(#fff 55%,var(--sky) 55%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar select{flex:1 1 0;min-width:0;background:transparent;color:var(--headInk);border:1px solid color-mix(in srgb,var(--headInk) 40%,transparent);border-radius:6px;padding:.62rem .35rem;font-size:.6rem;line-height:1.2;font-weight:600}
.bar select option{color:#16324F;background:#fff}
.linkbtn{background:none;border:0;color:var(--lane);font-weight:600;cursor:pointer;padding:.3rem .15rem;white-space:nowrap}
.navwrap{position:relative;display:flex;align-items:stretch;max-width:1100px;margin:.5rem auto 0}
nav{display:flex;gap:.2rem;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;scroll-behavior:smooth}
nav::-webkit-scrollbar{display:none}
.navarrow{flex:0 0 auto;background:var(--head);color:var(--lane);border:0;font:700 1.5rem/1 var(--body);padding:0 .45rem;cursor:pointer;z-index:1}
.navarrow[hidden]{display:none}
.navarrow.l{box-shadow:6px 0 8px -4px var(--head)}
.navarrow.r{box-shadow:-6px 0 8px -4px var(--head)}
nav button{background:none;border:0;color:inherit;opacity:.72;padding:.45rem .75rem;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;font-weight:600}
nav button[aria-selected="true"]{opacity:1;background:var(--paper);color:var(--ink)}

.banner{max-width:1100px;margin:1rem auto 0;padding:0 1rem}
.banner div{background:var(--me);border:1px solid var(--lane);border-radius:8px;padding:.6rem .9rem;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:1.1rem 1rem 4rem}
.panel{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:1.1rem;margin-bottom:1rem}
.panel h2{font:700 1.35rem/1.2 var(--cond);margin-bottom:.6rem}
.panel h3{font:700 1.1rem/1.2 var(--cond);margin:1.1rem 0 .4rem}
.panel p+p{margin-top:.6rem}
.note{color:var(--muted);font-size:.93rem;max-width:70ch}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.grow{flex:1 1 14rem}
label{display:block;font-weight:600;font-size:.92rem;margin:.8rem 0 .3rem}
label.check{display:flex;gap:.5rem;align-items:flex-start;font-weight:500}
label.check input{margin-top:.3rem}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:.55rem .65rem;border:1px solid var(--grid);border-radius:6px;background:var(--paper)}
.btn{border:1px solid var(--ink);background:transparent;padding:.5rem .9rem;border-radius:6px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--lane);border-color:var(--lane);color:var(--laneInk);font-size:1.05rem;padding:.7rem 1.4rem}
.btn.small{padding:.2rem .55rem;font-size:.85rem}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--warn);font-weight:600}
.good{color:var(--ok);font-weight:600}

.two{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.panel,.two>*{min-width:0}

.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
.choice{text-align:left;border:1px solid var(--grid);background:var(--paper);border-radius:8px;padding:.55rem .7rem;cursor:pointer}
.choice b{display:block;font:700 1.05rem/1.2 var(--cond)}
.choice small{color:var(--muted)}
.choice[aria-pressed="true"]{border:2px solid var(--ink);background:var(--card)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.balls{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.balls .choice{text-align:center}
.slot{margin-top:.5rem;font-weight:600;color:var(--ok)}
.slot.warn{color:var(--warn)}
.preview{margin:1rem 0;padding:.75rem;border-left:4px solid var(--lane);background:var(--paper);border-radius:0 6px 6px 0;min-height:3rem}
.preview:empty{display:none}
.preview .big{font:400 1.4rem/1.2 var(--display);color:var(--mark)}

/* scoresheet */
.card-scroll{overflow-x:auto;padding-bottom:.25rem}
.sheet{display:grid;grid-template-columns:repeat(calc(var(--n) - 1),minmax(2.5rem,1fr)) minmax(3.8rem,1.4fr) minmax(3.8rem,1.3fr);border:2px solid var(--ink);border-radius:4px;min-width:33rem;background:var(--card)}
.fr{border-right:1px solid var(--grid);display:flex;flex-direction:column}
.fr:last-child{border-right:0}
.fn{font:600 .72rem/1.4 var(--cond);text-align:center;color:var(--muted);border-bottom:1px solid var(--grid)}
.rolls{display:flex;justify-content:flex-end;height:1.55rem}
.rolls i{font:700 1rem/1.55rem var(--cond);font-style:normal;width:1.35rem;text-align:center;border-left:1px solid var(--grid);border-bottom:1px solid var(--grid)}
.mk{color:var(--mark)}
.cum{font:700 1.15rem/1.9rem var(--cond);text-align:center;min-height:1.9rem}
.cum.pend{color:var(--muted);font-weight:500}
.tot .big{font:400 1.4rem/3.4rem var(--display);text-align:center}

/* frame list */
.flist{list-style:none;padding:0;margin:.8rem 0 0}
.fl{display:grid;grid-template-columns:2rem 1fr auto auto;gap:.2rem .7rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--grid)}
.fno{font:400 1.05rem/1 var(--display);color:var(--lane);text-align:center}
.fmid b{font:700 1.05rem/1.2 var(--cond);display:block}
.fmid small{color:var(--muted);display:block;line-height:1.35}
.fmk{text-align:center;min-width:3.5rem}
.fmk span{display:block;font:700 1.35rem/1 var(--cond);letter-spacing:.08em}
.fmk small{color:var(--muted);font-size:.78rem}
.fpt{text-align:right;min-width:3.6rem}
.fpt span{display:block;font:700 1.35rem/1 var(--cond)}
.fpt small{color:var(--muted);font-size:.78rem}
.facts{grid-column:2 / -1;display:flex;gap:.35rem;flex-wrap:wrap}
.fl.dim{opacity:.55}

/* standings */
.stand{padding:0;overflow:hidden}
.stand summary{list-style:none;display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;cursor:pointer}
.stand summary::-webkit-details-marker{display:none}
.stand.me summary{background:var(--me)}
.rank{font:400 1.25rem/1 var(--display);color:var(--lane);min-width:2rem;text-align:center}
.pname{flex:1;font:700 1.2rem/1.2 var(--cond)}
.pname small{display:block;font:500 .85rem var(--body);color:var(--muted)}
.ptotal{font:400 1.5rem/1 var(--display)}
.stand .inner{padding:0 1rem 1rem}

/* machines */
.mcard[hidden]{display:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.mcard h3{margin:0 0 .15rem}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.7rem 0}
.mstats div{background:var(--head);color:var(--headInk);border-radius:8px;padding:.45rem .6rem}
.mstats small{display:block;font-size:.75rem;opacity:.8}
.mstats b{font:400 1.15rem/1.2 var(--display)}
.ranges{margin-top:.2rem}
.ranges summary{cursor:pointer;font-weight:600;color:var(--ink);padding:.45rem 0;border-top:1px solid var(--grid)}
.ranges[open] summary{margin-bottom:.2rem}
.brackets{list-style:none;padding:0;margin:.3rem 0 0;font-variant-numeric:tabular-nums}
.brackets li{display:flex;justify-content:space-between;gap:.5rem;padding:.12rem 0;border-bottom:1px dashed var(--grid);font-size:.95rem}
.brackets li b{font-family:var(--cond);font-size:1.02rem}
.brackets li.hit b{color:var(--mark)}
.tag{font:600 .78rem var(--cond);background:var(--tagbg);border:1px solid var(--grid);border-radius:4px;padding:0 .35rem;white-space:nowrap}

table{border-collapse:collapse;width:100%}
th,td{padding:.4rem .5rem;border-bottom:1px solid var(--grid);text-align:left;vertical-align:middle}
th{font:600 .9rem var(--cond);color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem;margin-top:.8rem}
.pick button{padding:.8rem;border:1px solid var(--grid);background:var(--paper);border-radius:8px;font:700 1.1rem var(--cond);cursor:pointer;text-align:left}
.example{background:var(--paper);border-radius:8px;padding:.8rem;margin:.6rem 0}
.example .sheet{min-width:0}
pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem;background:var(--paper);padding:.6rem;border-radius:6px;max-height:20rem;overflow:auto}


.fa{font:700 .72rem/1.3 var(--cond);text-align:center;color:var(--ink);border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:.02em}
.fa.live{color:var(--lane)}
.fmk em{font-style:normal}
.fl.live{background:var(--me);border-radius:6px}
.big-tag{font-size:1rem;padding:.05rem .45rem;vertical-align:.15em}
.balllist{list-style:none;padding:0;margin:.8rem 0 0}
.balllist li{display:flex;gap:.8rem;align-items:baseline;padding:.35rem 0;border-bottom:1px dashed var(--grid)}
.balllist li span{color:var(--muted);min-width:3.5rem}
.balllist li b{font:700 1.25rem var(--cond);flex:1}
.balllist li small{color:var(--muted)}
#shareBox{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.6);display:flex;align-items:center;justify-content:center;padding:1rem}
#shareBox[hidden]{display:none}
.sharecard{background:var(--card);color:var(--ink);border-radius:12px;padding:1.3rem;width:min(26rem,100%);text-align:center}
.sharecard h2{font:700 1.4rem var(--cond);margin-bottom:.8rem}
.qr{background:#fff;border-radius:8px;padding:.4rem;max-width:18rem;margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
.url{margin:.8rem 0;font-weight:600;word-break:break-all}

.brackets li.cur{background:var(--me);font-weight:700;border-radius:4px;padding-left:.3rem;padding-right:.3rem}
.search{position:relative;margin-bottom:.8rem}
.search input{padding-left:2.1rem;font-size:1.05rem}
.search svg{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);width:1.05rem;height:1.05rem;color:var(--muted);pointer-events:none}
.ranges-enter{margin-top:.8rem}

/* TV board */
.tvctl{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.tvctl label{margin:0;display:flex;gap:.4rem;align-items:center;font-weight:600}
.tvctl select{width:auto;padding:.35rem .5rem}
.tv{--s:1;background:var(--head);color:var(--headInk);border-radius:10px;padding:calc(.9rem*var(--s));display:flex;flex-direction:column;font-size:calc(clamp(13px,1.15vw,30px)*var(--s));overflow:hidden}
.tv.max{position:fixed;inset:0;z-index:50;border-radius:0}
.tv:fullscreen{border-radius:0;width:100vw;height:100vh}
.tvhead{display:flex;align-items:baseline;gap:1em;flex-wrap:wrap;margin-bottom:.6em}
.tvhead h2{font:400 1.9em/1.1 var(--display);color:var(--headInk);margin:0;flex:1;min-width:0}
.tvhead span{opacity:.75;font-size:.9em}
.tvexit{background:none;border:1px solid color-mix(in srgb,var(--headInk) 40%,transparent);color:var(--headInk);border-radius:6px;padding:.2em .7em;cursor:pointer;font-size:.8em;opacity:.6}
.tv:not(.max):not(:fullscreen) .tvexit{display:none}
.tvgrid{display:grid;grid-template-columns:2.4em minmax(9em,2fr) repeat(calc(var(--n) - 1),minmax(0,1fr)) minmax(0,1.45fr) 3.8em;column-gap:0}
.tvcols{font:600 .8em var(--cond);opacity:.75;padding:0 0 .3em;text-align:center}
.tvcols > :nth-child(2){text-align:left;padding-left:.5em}
.tvbody{flex:1;overflow-y:auto;scrollbar-width:thin;height:72vh}
.tv.max .tvbody,.tv:fullscreen .tvbody{height:auto}
.tvrow{background:var(--card);color:var(--ink);border-radius:.35em;margin-bottom:.35em;overflow:hidden;align-items:stretch}
.tvrank{font:400 1.4em/1 var(--display);color:var(--lane);display:flex;align-items:center;justify-content:center;background:var(--head)}
.tvrow.top3 .tvrank{background:var(--lane);color:var(--laneInk)}
.tvname{padding:.25em .5em;display:flex;flex-direction:column;justify-content:center;min-width:0;border-right:2px solid var(--grid)}
.tvname b{font:700 1.25em/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvname small{font-size:.72em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvname small.live{color:var(--lane);font-weight:700}
.tvf{border-right:1px solid var(--grid);display:flex;flex-direction:column;min-width:0}
.tvf .ab{font:700 .66em/1.5 var(--cond);text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden}
.tvf .ab.live{color:var(--lane)}
.tvf .rl{display:flex;justify-content:flex-end;height:1.35em}
.tvf .rl i{font:700 1em/1.35em var(--cond);font-style:normal;width:1.25em;text-align:center;border-left:1px solid var(--grid);border-bottom:1px solid var(--grid)}
.tvf .cm{font:700 1.15em/1.6em var(--cond);text-align:center}
.tvf .cm.pend{color:var(--muted);font-weight:500}
.tvtot{display:flex;align-items:center;justify-content:center;font:400 1.55em/1 var(--display);background:var(--paper)}
.tvempty{padding:2em;text-align:center;opacity:.8}
body.tvmode .top,body.tvmode .banner{display:none}
body.tvmode main{max-width:none;padding:0}
body.tvmode .tvctl{display:none}
/* theme picker */
.iconbtn{display:flex;align-items:center;padding:.3rem .2rem}
.iconbtn svg{width:1.25rem;height:1.25rem}
#themeMenu{position:fixed;z-index:30;right:max(1rem,calc(50vw - 550px));top:3.4rem;background:var(--card);color:var(--ink);border:1px solid var(--grid);border-radius:10px;padding:.4rem;box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:13rem}
#themeMenu[hidden]{display:none}
#themeMenu p{font:600 .8rem var(--cond);color:var(--muted);padding:.2rem .5rem}
#themeMenu button{display:flex;gap:.6rem;align-items:center;width:100%;background:none;border:0;border-radius:6px;padding:.5rem;cursor:pointer;font-weight:600;text-align:left}
#themeMenu button[aria-checked="true"]{background:var(--me)}
.sw{display:flex;border-radius:4px;overflow:hidden;border:1px solid var(--grid)}
.sw i{width:.9rem;height:1.3rem}

/* bonus frames */
.banner div.bonus{background:var(--tagbg);border-color:var(--sky)}
.bonusrow{border-top:1px solid var(--grid);padding:.7rem 0}
.bonusrow .row{margin-top:.4rem;align-items:center}
.bonusrow select{width:auto;max-width:100%}

/* broadcast */
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:.8rem}
.seg button{background:none;border:0;padding:.5rem 1rem;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stpreview{width:100%;max-width:800px;overflow:hidden;border:1px solid var(--grid);border-radius:6px;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/20px 20px}
.stpreview iframe{border:0;width:800px;height:600px;transform-origin:0 0;display:block;background:transparent}
.urlbox{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.urlbox input{flex:1 1 18rem;font-size:.85rem}

/* stream window (800 x 600 browser source) */
body.streammode{overflow:hidden}
body.streammode .top,body.streammode .banner{display:none}
body.streammode main{max-width:none;padding:0}
body.streammode.clear{background:transparent}
.stream{--s:1;position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-size:calc(15px*var(--s));overflow:hidden}
.stream.clear{background:transparent}
@media (max-width:420px){.stream{font-size:calc(13px*var(--s))}.strow{grid-template-columns:1.8em minmax(4em,1fr) repeat(var(--fc,3),minmax(2.5em,4.4em)) minmax(2.7em,3.2em)}}
.sthead{display:flex;align-items:center;gap:.7em;background:var(--head);color:var(--headInk);padding:.35em .7em;border-top:var(--stripeW) solid var(--stripeA);box-shadow:inset 0 3px 0 var(--stripeB)}
.sthead b{font:400 1.2em/1.15 var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sthead span{font:600 .85em var(--cond);white-space:nowrap;opacity:.9;flex-shrink:0}
.stbody{flex:1;overflow:hidden;padding:.35em .4em 0}
.strow{display:grid;grid-template-columns:2.1em minmax(4.5em,1fr) repeat(var(--fc,3),minmax(2.7em,4.4em)) minmax(2.9em,3.4em);background:var(--card);border:1px solid var(--grid);border-radius:.3em;margin-bottom:.28em;overflow:hidden;align-items:stretch}
.strow .tvrank{font-size:1.15em}
.strow.top3 .tvrank{background:var(--lane);color:var(--laneInk)}
.stname{padding:.15em .5em;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stname b{font:700 1.2em/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stname small{font-size:.72em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stname small.live{color:var(--lane);font-weight:700}
.stf{border-left:1px solid var(--grid);display:flex;flex-direction:column;min-width:0}
.stf .ab{font:700 .62em/1.45 var(--cond);text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;border-bottom:1px solid var(--grid)}
.stf .rl{display:flex;justify-content:flex-end;height:1.3em}

.bbox{display:grid;grid-template-columns:1fr;gap:.45rem;margin:.4rem 0 .5rem;max-width:26rem}.bbox>div{display:grid;grid-template-columns:4.2rem 1fr;align-items:center;gap:.5rem}.bbox label{margin:0;font-weight:700}.bbox input{font-size:1.15rem;padding-top:.6rem;padding-bottom:.6rem}.bbox input:disabled{background:var(--grid);opacity:.55;cursor:not-allowed}
#fsc .balls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem}#fsc .balls .choice{padding:.35rem .4rem;font-size:.85rem}

#fsc .choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem}#fsc .choice{padding:.4rem .55rem}
.fgf{margin-bottom:1rem}

@media (max-width:520px){.fgf{font-size:.92em}.fgf .strow{grid-template-columns:1.8em minmax(4em,1fr) repeat(3,3em) 2.7em}}

#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(calc(100% + 3rem));visibility:hidden;background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:8px;font-weight:600;transition:transform .25s;max-width:92vw;z-index:10}

<body>
<header class="top">
  <div class="bar">
    <h1>Pinbowl</h1>
    <select id="tsel" aria-label="Tournament"></select>
    <button class="linkbtn iconbtn" id="themeBtn" aria-label="Change colors" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    <button class="linkbtn" id="share" aria-label="Share this site with a QR code">Share</button>
    <button class="linkbtn" id="acct">Admin</button>
  </div>
  <div class="navwrap"><button class="navarrow l" id="navL" aria-label="Show tabs to the left" hidden>‹</button><nav id="nav" role="tablist" aria-label="Sections"></nav><button class="navarrow r" id="navR" aria-label="Show tabs to the right" hidden>›</button></div>
</header>
<div class="banner" id="banner"></div>
<main id="main"><div class="panel">Loading…</div></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="shareBox" hidden></div>
<div id="themeMenu" role="menu" aria-label="Colors" hidden></div>
<script src="/qrcode.js"></script>

<script>
/* ================= basics ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if(v===null||v===undefined||v==='') return null; const n=parseInt(String(v).replace(/[^\d]/g,''),10); return isNaN(n)?null:n; };
const fmt = n => n==null ? '' : Number(n).toLocaleString('en-US');
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3400); }

async function api(path, method='GET', body){
  const r = await fetch(path, {method, headers: body?{'Content-Type':'application/json'}:{}, body: body?JSON.stringify(body):undefined, credentials:'same-origin'});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error) || `Error ${r.status}`);
  return j;
}
// admin change: the server sends back the updated tournament
async function change(path, method, body, okMsg){
  try{ const j=await api(`/api/admin/t/${T.id}${path}`, method, body); if(j.tournament) T=j.tournament; if(okMsg) toast(okMsg); render(); return j; }
  catch(e){ toast(e.message); return null; }
}
// player change: only works on the player's own games
async function pchange(path, method, body, okMsg){
  try{ const j=await api(`/api/player/t/${T.id}${path}`, method, body); if(j.tournament) T=j.tournament; if(okMsg) toast(okMsg); return j; }
  catch(e){ toast(e.message); return null; }
}

/* ================= state ================= */
let ADMIN=null, PLAYER=null, LIST=[], T=null, NEEDS_SETUP=false, tab=null, screen=null, adminSettings=null, pickName=null;
const SPARE_LAST_BALL = 3;
const P = id => T.players.find(p=>p.id===id);
const A = id => T.arenas.find(a=>a.id===id);
const readOnly = () => T && T.status==='archived';
const me = () => PLAYER && T ? T.players.find(p=>p.name.toLowerCase()===PLAYER.name.toLowerCase()) : null;
const abbr = a => a ? (a.abbr || a.name.slice(0,3).toUpperCase()) : '?';
const playingGame = pid => T.games.find(g=>g.playerId===pid && g.status==='playing');

/* ================= scoring ================= */
// each 10% of the target is one pin, starting at 0, capped at 9 (10 only comes from a strike or spare)
function pins(score, target){ if(score==null || !target) return 0; return Math.max(0, Math.min(9, Math.floor(score*10/target))); }
function gameRolls(g){
  const a=A(g.arenaId), t=a?a.target:0;
  if(g.hitBall===1) return {type:'strike', rolls:[10]};
  const first=pins(g.b1,t);
  if(g.hitBall>=2 && g.hitBall<=SPARE_LAST_BALL) return {type:'spare', rolls:[first,10-first]};
  const total=Math.max(first, pins(g.final,t));
  return {type:'open', rolls:[first,total-first]};
}
function scorePlayer(pid){
  const N=T.frames;
  const all=T.games.filter(g=>g.playerId===pid && g.status!=='playing').map(g=>({g,...gameRolls(g)}));
  const reg=all.slice(0,N), extra=all.slice(N), rolls=all.flatMap(f=>f.rolls);
  let idx=0, run=0, ok=true; const frames=[];
  reg.forEach((f,k)=>{
    const own=f.rolls.length;
    let need=f.type==='strike'?2:f.type==='spare'?1:0;
    if(k===N-1 && !T.tenthBonus) need=0;
    const nxt=rolls.slice(idx+own, idx+own+need);
    const base=f.type==='open' ? f.rolls[0]+f.rolls[1] : 10;
    const pts=base+nxt.reduce((a,b)=>a+b,0), resolved=nxt.length===need;
    run+=pts; ok=ok&&resolved;
    frames.push({...f, pts, resolved, cum:run, showCum:ok, need});
    idx+=own;
  });
  const bonusNeed = (reg.length===N && T.tenthBonus) ? frames[N-1].need : 0;
  let used=0,c=0; for(const f of extra){ if(c>=bonusNeed) break; used++; c+=f.rolls.length; }
  const bonus=extra.slice(0,used), unused=extra.slice(used);
  const bonusRolls=bonus.flatMap(f=>f.rolls).slice(0,bonusNeed);
  const stillNeeded=Math.max(0, bonusNeed-bonusRolls.length);
  return {pid, frames, bonus, unused, bonusRolls, total:run, complete: reg.length===N && frames.every(f=>f.resolved), regCount:reg.length, stillNeeded, playing:playingGame(pid)};
}
function nextSlot(pid){
  const r=scorePlayer(pid);
  if(r.regCount<T.frames) return {kind:'frame', n:r.regCount+1};
  if(r.stillNeeded>0) return {kind:'bonus', idx:r.bonus.length};
  return {kind:'done'};
}
const CATS=[['classic','Classic'],['mid','Mid'],['modern','Modern']];
const catName = c => (CATS.find(x=>x[0]===c)||[])[1] || '';
const catSelect = (attr,id,val) => `<select id="${attr}${id}" data-${attr}="${id}"><option value="">Pick one</option>${CATS.map(([k,l])=>`<option value="${k}" ${val===k?'selected':''}>${l}</option>`).join('')}</select>`;
// This week's regular machines by category (bonus-frame machines not counted)
function catMix(){
  const reg=T.arenas.filter(a=>a.active && !a.bonusOnly && !(T.bonusArenas||[]).includes(a.id));
  const c={classic:0,mid:0,modern:0,none:0}; reg.forEach(a=>{ c[a.cat||'none']++; });
  return {reg,c};
}
function catMixNote(){
  const {reg,c}=catMix();
  const counts=`Classic ${c.classic}, Mid ${c.mid}, Modern ${c.modern}${c.none?`, <span class="err">${c.none} without a category</span>`:''}`;
  const sorted=[c.classic,c.mid,c.modern].sort().join('/');
  const short=CATS.filter(([k])=>c[k]===3).map(x=>x[1]);
  const ok = !c.none && reg.length===T.frames && sorted==='3/3/4';
  return `<p class="note" style="margin-top:.5rem"><b>This week's ${reg.length} machines:</b> ${counts}. ${ok?`Frames ${T.frames+1} and ${T.frames+2} will come from ${short.join(' and ')}, for 4 of each.`:`<span class="err">For 4 of each after the bonus frames, use 3, 3 and 4.</span>`}</p>`;
}
// Frames 11 and 12 are one drawn machine each, the same for everyone
function bonusArena(i){ const id=((T&&T.bonusArenas)||[])[i]; return id?A(id):null; }
function bonusFrameOf(a){ const i=((T&&T.bonusArenas)||[]).indexOf(a.id); return i<0?0:T.frames+1+i; }
function bonusLine(){
  if(!T || !T.tenthBonus) return '';
  const parts=[0,1].map(i=>{ const a=bonusArena(i); return a?`frame ${T.frames+1+i} is <span class="tag">${esc(abbr(a))}</span> ${esc(a.name)} (target ${fmt(a.target)})`:''; }).filter(Boolean);
  return parts.length ? `Bonus ${parts.length>1?'frames':'frame'} for everyone: ${parts.join(', ')}` : '';
}
function symbols(rolls){
  const out=[]; let start=true, prev=0;
  for(const r of rolls){
    if(start){ if(r===10) out.push('X'); else { out.push(r?String(r):'–'); start=false; prev=r; } }
    else { out.push(prev+r===10?'/':(r?String(r):'–')); start=true; }
  }
  return out;
}
function standings(){
  const rows=T.players.map(p=>({p, r:scorePlayer(p.id)})).sort((a,b)=>b.r.total-a.r.total || a.p.name.localeCompare(b.p.name));
  let rank=0, last=null; rows.forEach((x,i)=>{ if(x.r.total!==last){ rank=i+1; last=x.r.total; } x.rank=rank; });
  // an admin's hand-set seed order wins
  if(Array.isArray(T.seedOverride) && T.seedOverride.length){
    const byId=new Map(rows.map(x=>[x.p.id,x])), ov=T.seedOverride.filter(id=>byId.has(id));
    const out=[...ov.map(id=>byId.get(id)), ...rows.filter(x=>!ov.includes(x.p.id))]; out.forEach((x,i)=>{ x.rank=i+1; }); return out;
  }
  return rows;
}
// How many make the finals: the admin's number, or the top half rounded down (weekly tournaments only)
function cutCount(t=T){ if(!t || t.daily || t.finals) return 0; const n=t.players.length; return Math.max(0, Math.min(n, t.finalsCount ? t.finalsCount : Math.floor(n/2))); }
function cutAfter(i, total, cls){ const c=cutCount(); return c && i===c-1 && i<total-1 ? `<div class="${cls}" role="separator"><span>Finals cut: top ${c}</span></div>` : ''; }
function playedArenaIds(pid, exceptId){ return new Set(T.games.filter(g=>g.playerId===pid && g.id!==exceptId && g.status!=='playing').slice(0,T.frames).map(g=>g.arenaId)); }

/* ================= shared pieces ================= */
function sheetHTML(r){
  const N=T.frames; let h=`<div class="card-scroll"><div class="sheet" style="--n:${N}">`;
  for(let k=0;k<N;k++){
    const f=r.frames[k], last=k===N-1; let cells=[];
    if(f) cells = last ? symbols(f.rolls.concat(r.bonusRolls)) : (f.type==='strike' ? ['','X'] : symbols(f.rolls));
    const slots = last ? (T.tenthBonus?3:2) : 2;
    while(cells.length<slots) last ? cells.push('') : cells.unshift('');
    const a=f?A(f.g.arenaId):(r.playing && k===r.regCount ? A(r.playing.arenaId) : null);
    const live = !f && a;
    h+=`<div class="fr" title="${a?esc(a.name):''}"><div class="fn">${k+1}</div><div class="fa ${live?'live':''}">${a?esc(frameAbbr(r,k)):'&nbsp;'}</div><div class="rolls">${cells.map(c=>`<i class="${c==='X'||c==='/'?'mk':''}">${c}</i>`).join('')}</div><div class="cum ${f&&!f.showCum?'pend':''}">${f?(f.showCum?f.cum:'…'):(live?'▶':'')}</div></div>`;
  }
  return h+`<div class="fr tot"><div class="fn">Total</div><div class="big">${r.total}</div></div></div></div>`;
}
// Short name for a frame. The last frame adds the machines of its bonus games, e.g. KK+GZL.
function frameAbbr(r,k){
  const f=r.frames[k];
  if(!f) return r.playing && k===r.regCount ? abbr(A(r.playing.arenaId)) : '';
  let s=abbr(A(f.g.arenaId));
  if(k===T.frames-1){ r.bonus.forEach(b=>{ s+='+'+abbr(A(b.g.arenaId)); }); if(r.playing && r.stillNeeded) s+='+'+abbr(A(r.playing.arenaId)); }
  return s;
}
function scoreText(g){
  if(Array.isArray(g.balls) && g.balls.length) return g.balls.map((s,i)=>`Ball ${i+1}: ${fmt(s)}`).join(', ');
  const parts=[];
  if(g.hitBall===1) parts.push('Target on ball 1'); else parts.push(`Ball 1: ${fmt(g.b1)}`);
  if(g.hitBall>=2) parts.push(`target on ball ${g.hitBall}`);
  if(g.final!=null) parts.push(`final: ${fmt(g.final)}`);
  return parts.join(', ');
}
function frameListHTML(r, mode){ // mode: 'admin' | 'self' | 'view'
  const rows=[];
  r.frames.forEach((f,k)=>rows.push({f, label:String(k+1), kind:'frame'}));
  r.bonus.forEach(f=>rows.push({f, label:'B', kind:'bonus'}));
  r.unused.forEach(f=>rows.push({f, label:'–', kind:'unused'}));
  const all=T.games.filter(g=>g.playerId===r.pid && g.status!=='playing');
  let html = rows.map(({f,label,kind})=>{
    const a=A(f.g.arenaId), sy=f.type==='strike'?['X']:symbols(f.rolls);
    const what = f.type==='strike'?'Strike':f.type==='spare'?'Spare':`${f.rolls[0]+f.rolls[1]} pins`;
    let pts='', sub='';
    if(kind==='frame'){ pts = f.resolved ? f.pts : `${f.pts}…`; sub = f.showCum ? `total ${f.cum}` : (f.resolved?'':'waiting on bonus'); }
    else if(kind==='bonus'){ pts='bonus'; sub=`for frame ${T.frames}`; }
    else { pts='—'; sub='not counted'; }
    const i=all.findIndex(g=>g.id===f.g.id);
    let acts='';
    if(!readOnly() && mode==='admin') acts=`<div class="facts">
      <button class="btn small" data-edit="${f.g.id}">Edit</button>
      <button class="btn small" data-move="${f.g.id}" data-dir="-1" ${i===0?'disabled':''}>Move up</button>
      <button class="btn small" data-move="${f.g.id}" data-dir="1" ${i===all.length-1?'disabled':''}>Move down</button>
      <button class="btn small danger" data-del="${f.g.id}">Delete</button></div>`;
    else if(!readOnly() && mode==='self' && Array.isArray(f.g.balls)) acts=`<div class="facts"><button class="btn small" data-fix="${f.g.id}">Fix my scores</button></div>`;
    return `<li class="fl ${kind==='unused'?'dim':''}"><span class="fno">${label}</span>
      <div class="fmid"><b><span class="tag">${esc(abbr(a))}</span> ${esc(a?a.name:'Removed machine')}</b><small>${esc(scoreText(f.g))}</small></div>
      <div class="fmk"><span>${sy.map(s=>`<em class="${s==='X'||s==='/'?'mk':''}">${s}</em>`).join(' ')}</span><small>${what}</small></div>
      <div class="fpt"><span>${pts}</span><small>${sub}</small></div>${acts}</li>`;
  }).join('');
  if(r.playing){
    const a=A(r.playing.arenaId);
    html += `<li class="fl live"><span class="fno">▶</span><div class="fmid"><b><span class="tag">${esc(abbr(a))}</span> ${esc(a?a.name:'')}</b><small>Playing now. ${esc(scoreText(r.playing))}</small></div><div class="fmk"><small>ball ${r.playing.balls.length+1} next</small></div><div class="fpt"></div>
      ${mode==='admin'&&!readOnly()?`<div class="facts"><button class="btn small danger" data-del="${r.playing.id}">Delete</button></div>`:''}</li>`;
  }
  if(!html) return '<p class="note" style="margin-top:.6rem">No games played yet.</p>';
  return `<ul class="flist">${html}</ul>`;
}
function bindGameActions(root){

// score/ballNo are optional: when given, the matching row is highlighted
function brackets(a, score, ballNo){
  const t=a.target; if(!t) return '<p class="note">Target score not set yet.</p>';
  let cur=null;
  if(score!=null){ if(score>=t) cur = ballNo===1 ? 'strike' : (ballNo>=2 && ballNo<=SPARE_LAST_BALL) ? 'spare' : 9; else cur=pins(score,t); }
  const li=[`<li class="hit ${cur==='strike'?'cur':''}"><b>Strike</b><span>target (${fmt(t)}) on ball 1</span></li>`, `<li class="hit ${cur==='spare'?'cur':''}"><b>Spare</b><span>target (${fmt(t)}) on ball 2 or 3</span></li>`];
  for(let n=9;n>=0;n--){
    const lo=Math.ceil(n*t/10), hi=n===9?t-1:Math.ceil((n+1)*t/10)-1;
    li.push(`<li class="${cur===n?'cur':''}"><b>${n} pin${n===1?'':'s'}</b><span>${n===9&&a.balls===5?`${fmt(lo)} or more`:`${fmt(lo)}–${fmt(hi)}`}</span></li>`);
  }
  return `<ul class="brackets">${li.join('')}</ul>`;
}

function renderMine(){
  const p=me();
  if(!p){ $('#main').innerHTML=notInTournament(); $('#chg').onclick=switchPlayer; if($('#joinNow')) $('#joinNow').onclick=async()=>{ if(await joinDaily()) go('play'); }; return; }
  const rows=standings(), mine=rows.find(x=>x.p.id===p.id), r=mine.r;
  const played=playedArenaIds(p.id);
  const left=T.arenas.filter(a=>a.active && !played.has(a.id));
  const status = r.playing ? `Playing ${A(r.playing.arenaId)?.name||''}` : r.complete ? 'Card complete' : r.stillNeeded ? `Play a bonus game for frame ${T.frames}` : `${r.regCount} of ${T.frames} frames played`;
  $('#main').innerHTML=`<div class="panel">
    <div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="margin:0">${esc(p.name)}</h2><button class="linkbtn" id="chg" style="color:var(--muted)">Not you?</button></div>

    ${sheetHTML(r)}
    ${!readOnly() && !r.complete ? `<div class="row" style="margin-top:.9rem"><button class="btn primary" id="toPlay">${r.playing?'Enter my next ball':'Start a game'}</button></div>`:''}
    ${frameListHTML(r,'self')}
    ${!r.complete && !r.stillNeeded && left.length && !readOnly() ? `<h3>Machines you haven't played</h3><p>${left.map(a=>`<span class="tag">${esc(abbr(a))}</span> ${esc(a.name)}`).join('<br>')}</p>`:''}
  </div>`;
  $('#chg').onclick=switchPlayer;

}

/* ================= player: enter score ball by ball ================= */
const PF={arenaId:'', score:'', fixId:null};
let MSEARCH='';
function resetPF(){ PF.arenaId=''; PF.score=''; PF.fixId=null; }
function ballHint(a, ballNo, score){
  if(score==null) return '';
  const t=a.target, pct=Math.floor(score*100/t);
  if(score>=t){
    if(ballNo===1) return `<span class="big">X</span> That reaches the target (${fmt(t)}) on ball 1: a strike!`;
    if(ballNo<=SPARE_LAST_BALL) return `<span class="big">/</span> That reaches the target (${fmt(t)}) on ball ${ballNo}: a spare!`;
    return `That reaches the target (${fmt(t)}) on ball ${ballNo}: 9 pins.`;
  }
  const last = ballNo>=a.balls;
  return `${pct}% of the target: <b>${pins(score,t)} pin${pins(score,t)===1?'':'s'}</b>${last?' final.':' so far.'}`;
}
function renderPlay(){
  const m=$('#main'), p=me();
  if(!p){ m.innerHTML=notInTournament(); $('#chg').onclick=switchPlayer; if($('#joinNow')) $('#joinNow').onclick=async()=>{ if(await joinDaily()) renderPlay(); }; return; }
  if(readOnly()){ m.innerHTML='<div class="panel">This tournament is archived, so scores are locked.</div>'; return; }
  if(PF.fixId) return renderFix(p);
  const g=playingGame(p.id), r=scorePlayer(p.id);
  let body='';
  if(g){
    const a=A(g.arenaId), n=g.balls.length+1;
    body=`<h2><span class="tag big-tag">${esc(abbr(a))}</span> ${esc(a.name)}</h2>
      <p class="note">${a.balls} balls, target ${fmt(a.target)}</p>
      <ul class="balllist">${g.balls.map((s,i)=>`<li><span>Ball ${i+1}</span><b>${fmt(s)}</b><small>${pins(s,a.target)} pins so far</small></li>`).join('')}</ul>
      <label for="bs">Score after ball ${n}</label>
      <input type="text" inputmode="numeric" id="bs" value="${esc(PF.score)}" placeholder="Your score on the machine now" autocomplete="off">
      <div class="preview" id="bhint"></div>
      <div class="row"><button class="btn primary" id="bgo">Save ball ${n}</button><button class="btn" id="fixCur">Fix an earlier ball</button><button class="btn danger" id="cancelG">Cancel this game</button></div>
      <p class="note" style="margin-top:.6rem">Enter your total score on the machine after each ball ends, before you plunge the next one.</p>
      ${rangesBox(a)}`;
  } else {
    const slot=nextSlot(p.id);
    if(slot.kind==='done'){ m.innerHTML=`<div class="panel"><h2>Your card is complete</h2><p>Final score: <b>${r.total}</b>. Check the Standings tab to see where you finished.</p></div>`; return; }
    const isBonus = slot.kind==='bonus', ba = isBonus ? bonusArena(slot.idx) : null;
    if(isBonus && !ba){ m.innerHTML=`<div class="panel"><h2>Frame ${T.frames+1+slot.idx}</h2><p>The machine for this bonus frame hasn't been drawn yet. Ask an organizer.</p></div>`; return; }
    if(isBonus) PF.arenaId=ba.id;
    const played=playedArenaIds(p.id), repeatOK=T.allowRepeats || isBonus;
    const arenas=isBonus ? [ba] : T.arenas.filter(a=>a.active);
    const a=A(PF.arenaId);
    const spare10 = r.frames[T.frames-1] && r.frames[T.frames-1].type==='spare';
    body=`<h2>${!isBonus?`Frame ${slot.n} of ${T.frames}`:`Frame ${T.frames+1+slot.idx}: bonus frame`}</h2>
      <p class="note">${isBonus?`Everyone plays the same machine for this frame. It was drawn at random.${spare10?' Only your ball 1 score counts toward your spare.':''}`:'Pick the machine you are about to play.'}</p>
      <div class="choices" style="margin-top:.6rem">${arenas.map(x=>{ const blocked=!isBonus && ((!repeatOK && played.has(x.id)) || !x.target);
        return `<button class="choice" data-parena="${x.id}" aria-pressed="${x.id===PF.arenaId}" ${blocked?'disabled':''}><b><span class="tag">${esc(abbr(x))}</span> ${esc(x.name)}</b><small>${!x.target?'no target yet':played.has(x.id)&&!repeatOK?'already played':`${x.balls} balls, target ${fmt(x.target)}`}</small></button>`; }).join('')}</div>
      ${a?`<label for="bs">Score after ball 1 on ${esc(a.name)}</label>
      <input type="text" inputmode="numeric" id="bs" value="${esc(PF.score)}" placeholder="Your score on the machine now" autocomplete="off">
      <div class="preview" id="bhint"></div>
      <div class="row"><button class="btn primary" id="bgo">Save ball 1</button></div>${rangesBox(a)}`:''}`;
  }
  m.innerHTML=`<div class="two"><div class="panel">${body}</div><div class="panel"><h2>My card</h2>${sheetHTML(r)}</div></div>`;
  bindRanges();

  $$('[data-parena]').forEach(b=>b.onclick=()=>{ PF.arenaId=b.dataset.parena; renderPlay(); const i=$('#bs'); if(i) i.focus(); });
  const inp=$('#bs');
  if(inp){
    const arena = g ? A(g.arenaId) : A(PF.arenaId), ballNo = g ? g.balls.length+1 : 1;
    const upd=()=>{ PF.score=inp.value; const s=num(inp.value); const min=g?g.balls[g.balls.length-1]:0;
      $('#bhint').innerHTML = s==null ? '' : s<min ? `<span class="err">That's lower than your ball ${g.balls.length} score.</span>` : ballHint(arena, ballNo, s);
      updateRanges(arena, s!=null&&s>=min?s:null, ballNo); };
    inp.oninput=upd; inp.onblur=()=>{ const n=num(inp.value); if(n!=null){ inp.value=fmt(n); PF.score=inp.value; } };
    inp.onkeydown=e=>{ if(e.key==='Enter') $('#bgo').click(); };
    upd();
    $('#bgo').onclick=async()=>{
      const s=num(inp.value); if(s==null){ toast('Enter your score.'); return; }
      $('#bgo').disabled=true;
      const j=await pchange('/ball','POST', g?{score:s}:{arenaId:PF.arenaId, score:s});
      if(!j){ $('#bgo').disabled=false; return; }
      PF.score='';
      const cur=T.games.find(x=>x.id===(g?g.id:null)) || T.games.filter(x=>x.playerId===p.id).slice(-1)[0];
      if(cur && cur.status==='done'){ PF.arenaId=''; const rr=gameRolls(cur); toast(rr.type==='strike'?'Strike!':rr.type==='spare'?'Spare!':`Game saved: ${rr.rolls[0]+rr.rolls[1]} pins`); go('mine'); }
      else { toast(`Ball ${ballNo} saved. Good luck on ball ${ballNo+1}!`); renderPlay(); }
    };
  }
  if($('#fixCur')) $('#fixCur').onclick=()=>{ PF.fixId=g.id; renderPlay(); };
  if($('#cancelG')) $('#cancelG').onclick=async()=>{ if(!confirm('Cancel this game? Its scores will be removed.')) return; const j=await pchange(`/games/${g.id}`,'DELETE',null,'Game cancelled'); if(j){ resetPF(); renderPlay(); } };
}
function renderFix(p){
  const g=T.games.find(x=>x.id===PF.fixId && x.playerId===p.id);
  if(!g || !Array.isArray(g.balls)){ PF.fixId=null; return renderPlay(); }
  const a=A(g.arenaId);
  $('#main').innerHTML=`<div class="panel" style="max-width:34rem"><h2>Fix scores: ${esc(a.name)}</h2>
    <p class="note">Change any ball's score. Each ball's score is your total on the machine when that ball ended.</p>
    ${g.balls.map((s,i)=>`<label for="fx${i}">Score after ball ${i+1}</label><input type="text" inputmode="numeric" id="fx${i}" data-fx="${i}" value="${fmt(s)}">`).join('')}
    <div class="row" style="margin-top:1rem"><button class="btn primary" id="fxSave">Save changes</button><button class="btn" id="fxBack">Back</button></div></div>`;
  $('#fxBack').onclick=()=>{ PF.fixId=null; renderPlay(); };
  $('#fxSave').onclick=async()=>{
    const balls=$$('[data-fx]').map(i=>num(i.value));
    const j=await pchange(`/games/${g.id}`,'PUT',{balls},'Scores fixed');
    if(j){ PF.fixId=null; const now=T.games.find(x=>x.id===g.id); go(now&&now.status==='playing'?'play':'mine'); }
  };
}

function renderMachines(){
  const edit = ADMIN && !readOnly();
  const list = ADMIN ? T.arenas : T.arenas.filter(a=>a.active || bonusFrameOf(a));
  if(ADMIN && !STORED){ loadStored().then(()=>{ if(tab==='machines' && !readOnly()) renderMachines(); }); }
  const src = a => a.targetSource==='mp' ? '<span class="tag">from Matchplay</span>' : a.targetSource==='saved' ? '<span class="tag">saved from last time</span>' : '';
  const cards = list.map(a=>{
    const gs=T.games.filter(g=>g.arenaId===a.id && g.status!=='playing'), strikes=gs.filter(g=>g.hitBall===1).length;
    const avg = gs.length ? (gs.reduce((s,g)=>{ const r=gameRolls(g); return s+(r.type==='open'?r.rolls[0]+r.rolls[1]:10); },0)/gs.length).toFixed(1) : '–';
    const ctl = edit ? `<div class="row" style="margin-top:.6rem">
        <div style="flex:0 0 5.5rem"><label for="ab${a.id}">Short name</label><input type="text" id="ab${a.id}" data-abbr="${a.id}" value="${esc(abbr(a))}" maxlength="5" style="text-transform:uppercase"></div>
        <div style="flex:0 0 7rem"><label for="cat${a.id}">Category</label>${catSelect('cat',a.id,a.cat)}</div>
        <div style="flex:0 0 5rem"><label for="b${a.id}">Balls</label><select id="b${a.id}" data-balls="${a.id}"><option ${a.balls===3?'selected':''}>3</option><option ${a.balls===5?'selected':''}>5</option></select></div>
        <div class="grow"><label for="t${a.id}">Target score</label><input type="text" inputmode="numeric" id="t${a.id}" data-target="${a.id}" value="${a.target?fmt(a.target):''}" placeholder="Required"></div></div>
        <label class="check"><input type="checkbox" data-active="${a.id}" ${a.active?'checked':''}> Open for play</label>
        <button class="btn small danger" data-rma="${a.id}" style="margin-top:.4rem">Remove machine</button>` : '';
    return `<div class="panel mcard" data-find="${esc((a.name+' '+abbr(a)+' '+catName(a.cat)).toLowerCase())}"><h3><span class="tag big-tag">${esc(abbr(a))}</span> ${esc(a.name)}</h3>
      <p class="note">${a.cat?`<span class="tag">${catName(a.cat)}</span> `:''}${a.balls} balls, target ${a.target?fmt(a.target):'not set'} ${src(a)}${bonusFrameOf(a)?` <span class="tag">bonus frame ${bonusFrameOf(a)}</span>`:(!a.active?' <span class="tag">closed</span>':'')}</p>
      <div class="mstats"><div><small>Played</small><b>${gs.length}</b></div><div><small>Strikes</small><b>${strikes}</b></div><div><small>Avg. pins</small><b>${avg}</b></div></div>
      ${a.target?`<details class="ranges" data-mid="${a.id}"><summary>Score needed for each pin count</summary>${brackets(a)}</details>`:brackets(a)}${ctl}</div>`;
  }).join('');
  const add = edit ? bonusPanel() + `<div class="panel"><h2>Machines</h2><p class="note">Targets, ball counts and short names are remembered on the Stored machines tab. When a machine comes back in a later tournament, they fill in automatically.</p>${catMixNote()}
    <div class="row" style="margin-top:.5rem"><div class="grow"><label for="na">Add a machine by hand</label><input type="text" id="na"></div><button class="btn" id="naGo">Add machine</button></div></div>` : '';
  const toggle = list.some(a=>a.target) ? `<div class="row" style="margin-bottom:.8rem"><button class="btn small" id="rangesAll">Show all score ranges</button></div>` : '';
  const search = list.length>1 ? `<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input type="search" id="msearch" placeholder="Search machines by name or short name" aria-label="Search machines" value="${esc(MSEARCH)}" autocomplete="off"></div>` : '';
  $('#main').innerHTML = add + search + toggle + (list.length?`<div class="mgrid">${cards}</div><p class="note" id="mnone" hidden>No machines match that search.</p>`:'<div class="panel note">No machines yet.</div>');
  const filterMachines=()=>{ const q=MSEARCH.trim().toLowerCase(); let shown=0;
    $$('.mcard').forEach(c=>{ const hit=!q || (c.dataset.find||'').includes(q); c.hidden=!hit; if(hit) shown++; });
    if($('#mnone')) $('#mnone').hidden = shown>0; };
  if($('#msearch')){ $('#msearch').oninput=e=>{ MSEARCH=e.target.value; filterMachines(); }; filterMachines(); }
  if($('#rangesAll')) $('#rangesAll').onclick=()=>{ const ds=$$('details.ranges'), open=!ds.every(d=>d.open); ds.forEach(d=>d.open=open); $('#rangesAll').textContent=open?'Hide all score ranges':'Show all score ranges'; };
  if(!edit) return;
  $$('[data-bdraw]').forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.bdraw), a=bonusArena(i);
    const n=a?T.games.filter(g=>g.arenaId===a.id).length:0;
    if(a && !confirm(n?`${a.name} has already been played ${n} time${n===1?'':'s'}. Draw a different machine for frame ${T.frames+1+i} anyway? Games already played stay as they are.`:`Draw a different machine for frame ${T.frames+1+i}?`)) return;
    change('/bonus','POST',{index:i},`Frame ${T.frames+1+i} machine drawn`); });
  $$('[data-bpick]').forEach(s=>s.onchange=()=>{ if(s.value) change('/bonus','POST',{index:Number(s.dataset.bpick), machineId:s.value},'Bonus machine set'); });

  $$('[data-abbr]').forEach(i=>i.onchange=()=>change(`/arenas/${i.dataset.abbr}`,'PATCH',{abbr:i.value},'Short name saved'));
  $$('[data-balls]').forEach(i=>i.onchange=()=>change(`/arenas/${i.dataset.balls}`,'PATCH',{balls:Number(i.value)},'Saved'));
  $$('[data-cat]').forEach(i=>i.onchange=()=>{ STORED=null; change(`/arenas/${i.dataset.cat}`,'PATCH',{cat:i.value},'Category saved'); });
  $$('[data-target]').forEach(i=>i.onchange=()=>change(`/arenas/${i.dataset.target}`,'PATCH',{target:num(i.value)||0},'Target saved'));
  $$('[data-active]').forEach(i=>i.onchange=()=>change(`/arenas/${i.dataset.active}`,'PATCH',{active:i.checked},'Saved'));
  $$('[data-rma]').forEach(b=>b.onclick=()=>{ const n=T.games.filter(g=>g.arenaId===b.dataset.rma).length; if(confirm(n?`${n} games were played on this machine. Removing it deletes them. Continue?`:'Remove this machine?')) change(`/arenas/${b.dataset.rma}`,'DELETE',null,'Machine removed'); });
}

// Opened as an admin tab, or on any TV with the link ?tv (no login needed, view only).
const QS = new URLSearchParams(location.search);
const TVMODE = QS.has('tv');
// Stream window: an 800 x 600 page for an OBS browser source. Settings come from the link only.
const STREAMMODE = QS.has('stream');
const ST = { grp: QS.get('grp')||'A', speed: QS.has('speed') ? Number(QS.get('speed'))||0 : 30, size: Number(QS.get('size'))||1, clear: QS.get('bg')==='clear', back: QS.has('back') ? Math.max(0,Math.min(6,Number(QS.get('back'))||0)) : 2 };
const TV_FIXED_T = QS.get('t');
const TV = { auto: store.get('pb-tv-auto')!=='0', speed: Number(store.get('pb-tv-speed'))||40, size: Number(store.get('pb-tv-size'))||1, raf:0, pauseUntil:0, last:0, dir:1, wake:null };

function tvRows(){
  if(T.finals) return finalsBoardHTML();
  const N=T.frames, rows=standings();
  if(!rows.length) return '<div class="tvempty">No players yet.</div>';
  return rows.map((x,xi)=>{
    const r=x.r;
    let cells='';
    for(let k=0;k<N;k++){
      const f=r.frames[k], last=k===N-1; let sy=[];
      if(f) sy = last ? symbols(f.rolls.concat(r.bonusRolls)) : (f.type==='strike' ? ['','X'] : symbols(f.rolls));
      const slots = last ? (T.tenthBonus?3:2) : 2;
      while(sy.length<slots) last ? sy.push('') : sy.unshift('');
      const ab=frameAbbr(r,k), live=!f && ab;
      cells+=`<div class="tvf"><div class="ab ${live||(last&&r.playing&&r.stillNeeded)?'live':''}">${esc(ab)||'&nbsp;'}</div><div class="rl">${sy.map(c=>`<i class="${c==='X'||c==='/'?'mk':''}">${c}</i>`).join('')}</div><div class="cm ${f&&!f.showCum?'pend':''}">${f?(f.showCum?f.cum:'…'):(live?'▶':'')}</div></div>`;
    }
    const st = r.playing ? `<small class="live">Playing ${esc(A(r.playing.arenaId)?.name||'')}</small>` : `<small>${r.complete?'Complete':r.stillNeeded?'Bonus game needed':`${r.regCount} of ${N} frames`}</small>`;
    return `<div class="tvgrid tvrow ${x.rank<=3&&r.total>0?'top3':''}"><div class="tvrank">${x.rank}</div><div class="tvname"><b>${esc(x.p.name)}</b>${st}</div>${cells}<div class="tvtot">${r.total}</div></div>${cutAfter(xi, rows.length, 'tvcut')}`;
  }).join('');
}
function tvHead(){
  if(T.finals) return finalsHeadInfo();

// Each row: rank, name, the last 4 frames, the frame being played now, and the total.
function streamCell(r,k,isCur){
  const N=T.frames, f=r.frames[k], last=k===N-1, slots=last?(T.tenthBonus?3:2):2;
  let sy=[], live=false;
  if(f){ sy = last ? symbols(f.rolls.concat(r.bonusRolls)) : (f.type==='strike' ? ['','X'] : symbols(f.rolls)); while(sy.length<slots) last ? sy.push('') : sy.unshift(''); }
  else if(isCur && r.playing){
    const a=A(r.playing.arenaId), b=r.playing.balls||[];
    if(a && b.length){ const p1=pins(b[0],a.target); sy.push(p1?String(p1):'–'); if(b.length>1){ const p2=pins(b[b.length-1],a.target)-p1; sy.push(p2>0?String(p2):'–'); } live=true; }
    while(sy.length<slots) sy.push('');
  } else while(sy.length<slots) sy.push('');
  const ab=frameAbbr(r,k);
  const cum = f ? (f.showCum?f.cum:'…') : (isCur ? (r.playing?'▶':'') : '');
  return `<div class="stf ${isCur?'cur':''}"><div class="ab">${k+1}${ab?` ${esc(ab)}`:''}</div><div class="rl">${sy.map(c=>`<i class="${c==='X'||c==='/'?'mk':''} ${live&&c?'lv':''}">${c}</i>`).join('')}</div><div class="cm ${f&&!f.showCum?'pend':''}">${cum}</div></div>`;
}
function streamRows(){
  if(T.finals) return finalsBoardHTML();

  if(!rows.length) return '<div class="tvempty">No players yet.</div>';
  return rows.map((x,xi)=>{
    const show=Math.min(N, ST.back+1), r=x.r, c=r.frames.length, cur=Math.min(c,N-1), start=Math.max(0,Math.min(cur-ST.back,N-show));
    let cells=''; for(let k=start;k<start+show;k++) cells+=streamCell(r,k, k===cur && !r.complete);
    const st = r.playing ? `<small class="live">Playing ${esc(A(r.playing.arenaId)?.name||'')}</small>` : `<small>${r.complete?'Final':r.stillNeeded?'Bonus frame next':`${c} of ${N} frames`}</small>`;
    return `<div class="strow ${x.rank<=3&&r.total>0?'top3':''}"><div class="tvrank">${x.rank}</div><div class="stname"><b>${esc(x.p.name)}</b>${st}</div>${cells}<div class="sttot">${r.total}</div></div>${cutAfter(xi, rows.length, 'stcut')}`;
  }).join('');
}

// Slowly scroll the standings, pause at the top and bottom, then start over.
const SCR={raf:0, pauseUntil:0, last:0, pos:0};
function autoScroll(getEl, getSpeed){
  cancelAnimationFrame(SCR.raf); SCR.last=0; SCR.pauseUntil=performance.now()+5000; SCR.pos=0;
  const step=t=>{
    const el=getEl(); if(!el) return;
    SCR.raf=requestAnimationFrame(step);
    const dt=SCR.last?Math.min(100,t-SCR.last):0; SCR.last=t;
    if(Math.abs(el.scrollTop-SCR.pos)>2) SCR.pos=el.scrollTop; // scrolled by hand or the list changed
    const max=el.scrollHeight-el.clientHeight, sp=getSpeed();
    if(!sp || max<=2 || t<SCR.pauseUntil) return;
    SCR.pos=Math.min(max, SCR.pos+sp*dt/1000); el.scrollTop=Math.round(SCR.pos);
    if(SCR.pos>=max-1){ SCR.pauseUntil=t+10000; setTimeout(()=>{ const e=getEl(); if(e){ e.scrollTop=0; SCR.pos=0; SCR.pauseUntil=performance.now()+5000; } },5000); }
  };
  SCR.raf=requestAnimationFrame(step);
}

// Every finished game from open and archived tournaments, weekly and daily, grouped by machine.
let STATS=null;
const SF={ weekly:true, daily:true, goal:Number(store.get('pb-goal'))||10, sort:store.get('pb-ssort')||'played', q:'' };
const pinsAt=(s,t)=> s==null ? null : (s>=t ? 'T' : Math.max(0,Math.min(9,Math.floor(s*10/t))));
// What each ball of a game reached (0-9 pins, or 'T' for the target), and how the game ended
function readGame(r){
  let per=[];
  if(r.balls) per=r.balls.map(s=>pinsAt(s,r.target));
  else if(r.hit===1) per=['T'];
  else {
    per[0]=pinsAt(r.b1,r.target);
    if(r.hit>=2){ for(let i=1;i<r.hit-1;i++) per[i]=null; per[r.hit-1]='T'; }
    else { for(let i=1;i<r.nb-1;i++) per[i]=null; per[r.nb-1]=pinsAt(r.final,r.target); }
  }
  if(r.hit===1) return {per,type:'strike',total:10};
  if(r.hit>=2 && r.hit<=SPARE_LAST_BALL) return {per,type:'spare',total:10};
  const f=per[0]==null||per[0]==='T'?0:per[0], fin=pinsAt(r.final,r.target);
  return {per,type:'open',total:Math.max(f, fin==='T'?9:(fin||0))};
}
function machineStats(list){
  const st={n:list.length, strikes:0, spares:0, pins:0, end:Array(12).fill(0), balls:[], b1:[], b1Unknown:0, nb:3, byT:new Map()};
  list.forEach(r=>{
    const g=readGame(r); st.nb=Math.max(st.nb,r.nb);
    if(g.type==='strike'){ st.strikes++; st.end[11]++; } else if(g.type==='spare'){ st.spares++; st.end[10]++; } else st.end[g.total]++;
    st.pins+=g.total;
    g.per.forEach((v,i)=>{ if(v==null) return; st.balls[i]=st.balls[i]||Array(11).fill(0); st.balls[i][v==='T'?10:v]++; });
    if(r.b1!=null || (r.balls&&r.balls.length)) st.b1.push(r.balls?r.balls[0]:r.b1); else if(r.hit===1) st.b1Unknown++;
    const k=r.tid, row=st.byT.get(k)||{tname:r.tname,daily:r.daily,when:r.when,target:r.target,n:0,strikes:0,spares:0,pins:0};
    row.n++; if(g.type==='strike') row.strikes++; if(g.type==='spare') row.spares++; row.pins+=g.total; st.byT.set(k,row);
  });
  return st;
}
const pct=(a,b)=> b ? Math.round(a*100/b)+'%' : '–';
const niceRound=s=>{ if(s<100) return Math.round(s); const p=10**(Math.floor(Math.log10(s))-1); return Math.round(s/p)*p; };
const shortNum=n=> n>=1e9 ? (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,'')+'B' : n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M' : n>=1e3 ? Math.round(n/1e3)+'K' : String(n);
// Column chart: one series, value on each non-empty column, hover shows the detail
function colChart(items, aria){
  const n=items.length, padL=24, padR=4, padT=14, padB=18, W=Math.max(200, padL+padR+n*26), H=130, pw=W-padL-padR, ph=H-padT-padB;
  const max=Math.max(1,...items.map(i=>i.value)), slot=pw/n, bw=Math.min(24, slot*0.72);
  const y=v=>padT+ph-(v/max)*ph;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">`;
  const ticks=max>=4?[0,Math.round(max/2),max]:[0,max];
  ticks.forEach(t=>{ s+=`<line class="gl" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL-4}" y="${y(t)+3}" text-anchor="end">${t}</text>`; });
  items.forEach((it,i)=>{
    const x=padL+slot*i+(slot-bw)/2, bh=(it.value/max)*ph, top=padT+ph-bh, r=Math.min(4,bh);
    s+=`<g class="b"><title>${esc(it.tip)}</title><rect class="hit" x="${padL+slot*i}" y="${padT}" width="${slot}" height="${ph+padB}"/>`;
    if(bh>0) s+=`<path class="bar" d="M${x},${top+bh}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${top+bh}Z"/><text class="v" x="${x+bw/2}" y="${top-3}" text-anchor="middle">${it.value}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${esc(it.label)}</text></g>`;
  });
  return s+'</svg>';
}
function suggestTarget(st, goal, current){
  const known=st.b1.slice().sort((a,b)=>b-a), unk=st.b1Unknown, n=known.length+unk;
  if(n<8) return `<p class="note">A target suggestion needs at least 8 games with a ball 1 score (this machine has ${n}).</p>`;
  const k=Math.max(1,Math.ceil(goal/100*n));
  if(k<=unk) return `<p>More than ${goal}% of games here are already strikes, and some of those strike scores weren't recorded, so the exact number can't be worked out. Try raising the target.</p>`;
  const s=niceRound(known[k-unk-1]), diff=current?Math.round((s-current)*100/current):0;
  return `<p>For about <b>${goal}%</b> strikes, set the target near <b>${fmt(s)}</b>${current?` (${diff>0?'+':''}${diff}% vs. now)`:''}.</p>`+
    (current && Math.abs(diff)>=3 ? `<button class="btn small" data-usetarget="${s}">Use ${fmt(s)}</button>` : '');
}
function quant(sorted,q){ if(!sorted.length) return null; const i=Math.min(sorted.length-1,Math.floor(q*(sorted.length-1)+0.5)); return sorted[i]; }
async function renderStats(){
  if(!STATS){ $('#main').innerHTML='<div class="panel">Loading stats…</div>'; try{ STATS=await api('/api/admin/stats'); }catch(e){ $('#main').innerHTML=`<div class="panel err">${esc(e.message)}</div>`; return; } if(tab!=='stats') return; }
  const games=STATS.games.filter(r=> r.daily ? SF.daily : SF.weekly);
  const groups=new Map(); games.forEach(r=>{ const g=groups.get(r.key)||[]; g.push(r); groups.set(r.key,g); });
  const stored=new Map(STATS.machines.map(m=>[m.id,m]));

/* ================= finals ================= */
// Same group layout as the server: PAPA style 1-8-9-16, with byes for the top seeds when needed
function fSnake(seeds, groups){ const out=Array.from({length:groups},()=>[]); seeds.forEach((s,i)=>{ const row=Math.floor(i/groups), col=i%groups; out[row%2===0?col:groups-1-col].push(s); }); return out; }
function fPlan(N){ if(N<=4) return {byes:0,groups:1}; let S=4; while(S*2<=N) S*=2; if(N===S) return {byes:0,groups:S/4}; const g=Math.ceil((N-S)/2); return {byes:S-2*g,groups:g}; }
// Totals shared out as 21 Matchplay points (4-2-1-0 over 3 games), whole numbers that add up to 21
function mpPoints(totals){
  const sum=totals.reduce((a,b)=>a+b,0), raw=totals.map(v=>sum? v*21/sum : 21/totals.length), pts=raw.map(Math.floor);
  let left=21-pts.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(left>0){ pts[i]++; left--; } });
  return pts;
}
// Matchplay wants each finals game scored 4-2-1-0. Pinbowl carries strike and spare bonuses
// between games, so we choose a 4-2-1-0 split for each game that (1) keeps the pinbowl finishing
// order, (2) gets each player's 3-game total as close as possible to their share of 21, and
// (3) otherwise follows who actually did best on each game.
const MP_GAME=[4,2,1,0];
function perms(a){ if(a.length<=1) return [a.slice()]; const out=[]; a.forEach((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).forEach(p=>out.push([x,...p]))); return out; }
function gameOrder(g, i){
  const key=pid=>{ const r=(g.scores[pid]||[])[i]; if(!r||r.status==='playing') return [-1,0]; const f=gameRolls({arenaId:g.machines[i],...r});
    const q = f.type==='strike' ? 100 : f.type==='spare' ? 50-(r.hitBall||2) : f.rolls[0]+f.rolls[1];
    return [q, r.final!=null?r.final:(r.b1||0)]; };
  return g.players.slice().sort((a,b)=>{ const x=key(a), y=key(b); return y[0]-x[0] || y[1]-x[1] || fSeed(a)-fSeed(b); });
}
function mpGameSplit(g, final){
  const res=fResult(g, final); if(!res.complete || res.tie) return null;
  const n=g.players.length, vals=MP_GAME.slice(0,n), total=3*vals.reduce((a,b)=>a+b,0);
  const ranked=res.ranked.map(r=>r.pid), sum=res.ranked.reduce((s,r)=>s+r.total,0);
  const target=Object.fromEntries(res.ranked.map(r=>[r.pid, sum ? r.total*total/sum : total/n]));
  const actual=[0,1,2].map(i=>gameOrder(g,i)), P=perms(ranked.map((_,k)=>k));
  let best=null;
  for(const a of P) for(const b of P) for(const c of P){
    const pick=[a,b,c], tot={}; ranked.forEach(pid=>tot[pid]=0);
    // pick[i][k] = place (0 = 1st) given to the k-th player of the game's actual order
    pick.forEach((pp,i)=>actual[i].forEach((pid,k)=>{ tot[pid]+=vals[pp[k]]; }));
    let ok=true;
    for(let k=1;k<ranked.length;k++){ const hi=ranked[k-1], lo=ranked[k], same=res.ranked[k-1].total===res.ranked[k].total && !g.order; if(same ? tot[hi]<tot[lo] : tot[hi]<=tot[lo]){ ok=false; break; } }
    if(!ok) continue;
    const dev=ranked.reduce((s,pid)=>s+(tot[pid]-target[pid])**2,0);
    const moved=pick.reduce((s,pp)=>s+pp.reduce((t,v,k)=>t+Math.abs(v-k),0),0);
    if(!best || dev<best.dev-1e-9 || (Math.abs(dev-best.dev)<1e-9 && moved<best.moved)) best={dev,moved,pick,tot};
  }
  if(!best) return null;
  const games=[0,1,2].map(i=>{ const m={}; actual[i].forEach((pid,k)=>m[pid]={pts:vals[best.pick[i][k]], actualPlace:k, adjusted:best.pick[i][k]!==k}); return m; });
  return {ranked, games, tot:best.tot, target, total};
}
function renderFinalsTotals(){

    <p class="note">Enter these in Matchplay for each finals game: 4 points for 1st, 2 for 2nd, 1 for 3rd and 0 for 4th. Strike and spare bonuses carry between games in pinbowl, so the points are worked out once all 3 games in a group are done. Each player's 3-game total is as close as possible to their share of 21, and the pinbowl finishing order is always kept. Sometimes that means a game's points don't match who actually won that game; those are marked with *.</p></div>`;

        ${sp.games.some(m=>Object.values(m).some(c=>c.adjusted))?`<p class="note">* Actual finish on that game was different: ${sp.games.map((m,i)=>Object.entries(m).filter(([,c])=>c.adjusted).map(([pid,c])=>`G${i+1} ${esc(fName(pid))} was ${place(c.actualPlace)}`).join(', ')).filter(Boolean).join('; ')}.</p>`:''}</div>`;

const fSeed = pid => (T.finals.seeds.find(s=>s.pid===pid)||{}).seed;
const fName = pid => (T.finals.seeds.find(s=>s.pid===pid)||{}).name || '?';
// One player's 3 games as a 3-frame pinbowl card (bonuses carry forward, game 3 counts flat)
function fCard(g, pid){
  const res=g.scores[pid]||[], frames=g.machines.map((aid,i)=> res[i] && res[i].status!=='playing' ? {...gameRolls({arenaId:aid, ...res[i]})} : null);
  let total=0;
  frames.forEach((f,k)=>{ if(!f) return; const need=k===frames.length-1?0:(f.type==='strike'?2:f.type==='spare'?1:0);
    const next=frames.slice(k+1).filter(Boolean).flatMap(x=>x.rolls).slice(0,need); f.pts=(f.type==='open'?f.rolls[0]+f.rolls[1]:10)+next.reduce((a,b)=>a+b,0); f.wait=next.length<need; total+=f.pts; });
  return {pid, seed:fSeed(pid), frames, total, complete:g.machines.length===3 && frames.length===3 && frames.every(Boolean)};
}
function fResult(g, final){
  const rows=g.players.map(pid=>fCard(g,pid)), complete=rows.every(r=>r.complete);
  let ranked=rows.slice().sort((a,b)=>b.total-a.total || a.seed-b.seed);
  if(Array.isArray(g.order) && g.order.length===rows.length) ranked=g.order.map(pid=>rows.find(r=>r.pid===pid)).filter(Boolean);
  let tie=false;
  if(complete && !g.order){ const t=ranked.map(r=>r.total); tie = final ? t.some((v,i)=>i>0&&v===t[i-1]) : (t.length>2 && t[1]===t[2]); }
  return {rows, ranked, complete, tie};
}
function roundName(i, n, r){ return r.final ? 'Final' : `Round ${i+1}`; }
let FED=null; // staff editors: 'picks:gid', 'pos:gid', or the scorer {sc:gid, pid, fix:game index or null}
let SFS=''; // score being typed by staff
// Staff: enter any player's score after each ball, like players do for themselves
function staffScorerHTML(g){
  const ordP=g.players.slice().sort((x,y)=>(g.positions[x]||99)-(g.positions[y]||99)), pid=FED.pid, list=g.scores[pid]||[null,null,null];

function finalsRulesHTML(){
  return `<h2>Finals</h2>
  <p><b>Who makes it:</b> after qualifying, the top half of the players (rounded down) make the finals. The cut line shows on the Standings tab.</p>
  <p><b>Groups:</b> finalists play in groups of up to 4, set up like PAPA finals so the top seeds are spread out (for 16 players: 1, 8, 9 and 16 play together, and so on). If the number of finalists isn't 4, 8, 16 or 32, the top seeds get a bye into round 2.</p>
  <p><b>Picking games:</b> the top seed in each group picks 3 games: one Classic, one Mid and one Modern, and the order they're played. Groups take turns, starting with the group that has the highest seed. A group can't put a machine in the same game slot an earlier group already has it in, but it can use it for a different game. (If Group A plays Rush as game 1, Group B can still play Rush as game 2 or 3.)</p>
  <p><b>Picking positions:</b> next, each player picks whether they play 1st, 2nd, 3rd or 4th. The 2nd seed picks first, then the 3rd seed, and so on, with the top seed picking last. The app tells you when it's your turn.</p>
  <p><b>Playing:</b> the 3 games are scored as a 3-frame pinbowl card. Strikes and spares carry into the next game, and game 3 counts flat. <b>Enter your score after every ball</b> on the Finals tab, just like qualifying. Everyone in the group finishes a game before anyone starts the next one.</p>
  <p><b>Moving on:</b> the top 2 totals in each group move on to the next round and are regrouped by seed. Ties for a spot are settled with a tiebreaker game. In the last group, the highest total wins the finals.</p>
  <p><b>Matchplay points:</b> each finished group's totals are shared out of 21 points.</p>`;
}
function renderRules(){
  const a=T.arenas.find(x=>x.target)||{name:'King Kong',target:150000000,balls:3};
  const t=a.target, at=p=>fmt(Math.round(t*p/100));
  $('#main').innerHTML=`<div class="panel">
  ${T.finals?`${finalsRulesHTML()}<h2 style="margin-top:1.2rem">How pinbowl works</h2>`:''}
  ${T.finals?'':'<h2>How pinbowl works</h2>'}
  ${T.daily?`<p><b>NPC Daily Pinbowl Challenge:</b> open Friday 5 PM to midnight, and Saturday and Sunday 11 AM to 7 PM. Join any time it's open and play your card. When it closes, the highest total wins.</p>`:''}
  <p>Each game you play is one frame of bowling. Your card has ${T.frames} frames, and you can play the machines in any order${T.allowRepeats?'':', one game per machine'}. Your score adds up just like real bowling, so the best possible card is 300.</p>
  <p>Every machine has a target score. The Machines tab shows each target and exactly what score earns each pin count.</p>

  <h3>Entering your scores</h3>
  <p>You can play by yourself or with other people in a group of 2, 3 or 4. Everyone enters their own score on their own phone.</p>
  <p>Open Enter score, pick the machine, and type your total score after each ball, before you plunge the next one. The app tells you right away if you got a strike or spare. Made a typo? Use Fix my scores on your card.</p>

  <h3>Strike, spare, or pins</h3>
  <p><b class="mk">Strike (X):</b> reach the target score on ball 1.</p>
  <p><b class="mk">Spare (/):</b> reach the target on ball 2 or ball 3.</p>
  <p><b>Pins:</b> if you don't reach the target by ball 3, you get 1 pin for every 10% of the target, from 0 up to 9 pins. Your ball 1 score is your first throw, and your final score is your whole frame.</p>
  <div class="example"><b>Example on ${esc(a.name)}</b>, target ${fmt(t)}:<br>
  After ball 1 you have ${at(26)}. That's 26% of the target, so your first throw knocks down <b>2 pins</b>.<br>
  Your game ends at ${at(68)}. That's 68%, so the frame is <b>6 pins</b> total. Your card shows <b>2 4</b>.<br>
  If you had reached ${fmt(t)} on ball 2 or 3 instead, your card would show <b>2 /</b>, a spare.</div>

  <h3>Bonus points carry over</h3>
  <p>Strikes and spares are worth 10 plus a bonus from the frames that come next, so they can't be fully scored until you play your next game. Until then, your card shows “…”. Frames count in the order you play them. The short name above each frame shows which machine you played there.</p>
  <div class="example"><b>Strike, then an open frame.</b> Frame 1 is a strike. In frame 2 you get 3 pins on ball 1 and 7 pins total. The strike earns 10 plus the next two throws (3 + 4), so frame 1 is worth 17. Frame 2 adds 7, for 24.
  ${exampleSheet([{hitBall:1},{hitBall:0,b1:30,final:70},{hitBall:0,b1:0,final:0}])}</div>
  <div class="example"><b>Spare, then an open frame.</b> Frame 1 is a spare. In frame 2 you get 6 pins on ball 1. The spare earns 10 plus the next throw (6), so frame 1 is worth 16.
  ${exampleSheet([{hitBall:2,b1:40},{hitBall:0,b1:60,final:80},{hitBall:0,b1:0,final:0}])}</div>
  <div class="example"><b>Strikes in a row.</b> Two strikes and then 8 pins on ball 1: frame 1 is worth 10 + 10 + 8 = 28. Three strikes in a row (a turkey) makes the first one worth 30.
  ${exampleSheet([{hitBall:1},{hitBall:1},{hitBall:0,b1:85,final:92}])}</div>

  <h3>The last frame</h3>
  ${T.tenthBonus?`<p>A strike or spare in frame ${T.frames} earns bonus frames, just like the 10th frame in bowling.</p>
  <p><b>Spare in frame ${T.frames}:</b> play frame ${T.frames+1}. Only your ball 1 score counts.<br><b>Strike in frame ${T.frames}:</b> play frame ${T.frames+1}. If that's a strike too, play frame ${T.frames+2}.</p>
  <p>Frame ${T.frames+1} is played on one machine drawn at random from machines we've played before. It's drawn the first time anyone needs it, and then everyone plays that same machine. Frame ${T.frames+2} gets its own machine the same way.</p>
  <p>Machines come in three categories: Classic, Mid and Modern. Frames 1 to ${T.frames} use 3 from two categories and 4 from the third. Frames ${T.frames+1} and ${T.frames+2} come from the two categories with 3, so a full card has 4 of each.</p>

  ${!T.finals && !T.daily ? `<div style="margin-top:1.4rem">${finalsRulesHTML()}</div>` : ''}
  </div>`;

function ballsFromRecord(r, a){
  if(!r) return [];
  if(Array.isArray(r.balls) && r.balls.length) return r.balls.map(fmt);
  const t=a&&a.target||0, out=[];
  if(r.hitBall===1){ out.push(fmt(r.b1!=null?r.b1:t)); return out; }
  if(r.b1!=null) out.push(fmt(r.b1));
  const end = r.hitBall>=2 ? r.hitBall : (a&&a.balls||3), last = r.final!=null ? r.final : (r.hitBall>=2 ? t : r.b1);
  while(out.length<end-1) out.push(fmt(r.b1));
  if(last!=null) out.push(fmt(last));
  return out;
}
function ballRead(a, vals){
  const n=a&&a.balls||3, nums=[]; let hit=0, err='';
  for(let i=0;i<n;i++){ const v=num(vals[i]); if(v==null) break; if(nums.length && v<nums[nums.length-1]){ err=`Ball ${i+1}'s score is lower than ball ${i}'s.`; break; } nums.push(v); if(a.target && v>=a.target){ hit=i+1; break; } }
  const done = !err && nums.length && (hit>0 || nums.length>=n);
  const hitBall = hit && hit<=SPARE_LAST_BALL ? hit : 0;
  return {nums, hit, done, err, hitBall, b1:nums[0], final:nums[nums.length-1], n};
}
function ballBoxesHTML(a, vals, key){
  const n=a&&a.balls||3, rd=ballRead(a, vals), stop=rd.hit||99;
  return `<div class="bbox" style="--n:${n}">${Array.from({length:n},(_,i)=>{ const off=i>=stop; return `<div><label for="${key}${i}">Ball ${i+1}</label><input type="text" inputmode="numeric" id="${key}${i}" data-bx="${key}" data-bi="${i}" value="${off?'':esc(vals[i]||'')}" ${off?'disabled placeholder="—"':''} autocomplete="off"></div>`; }).join('')}</div>`;
}
function ballVerdict(a, rd){
  if(rd.err) return `<span class="err">${esc(rd.err)}</span>`;
  if(!rd.nums.length) return '';
  const t=a.target, first=pins(rd.nums[0],t), pct=v=>Math.min(100,Math.floor(v*100/t));
  if(rd.hit===1) return '<span class="big">X</span><br>Strike: 10 pins plus the next two throws.';
  if(rd.hitBall>=2) return `<span class="big">${first||'–'} /</span><br>${first} pins on ball 1 (${pct(rd.nums[0])}%), then a spare on ball ${rd.hitBall}.`;
  const tot=Math.max(first,pins(rd.final,t));
  if(!rd.done) return `${first} pins on ball 1 (${pct(rd.nums[0])}%)${rd.nums.length>1?`, ${tot} pins so far (${pct(rd.final)}%)`:''}. <span class="note">Game not finished yet.</span>`;
  return `<span class="big">${first||'–'} ${tot-first||'–'}</span><br>${first} pins on ball 1 (${pct(rd.nums[0])}%), ${tot} pins for the game (${pct(rd.final)}%).`;
}
// keep greying-out live while typing, without redrawing the page
function bindBallBoxes(key, a, vals, onChange){
  const boxes=$$(`[data-bx="${key}"]`);
  const sync=()=>{ boxes.forEach((b,i)=>{ if(!b.disabled) vals[i]=b.value; }); const rd=ballRead(a, vals), stop=rd.hit||99;
    boxes.forEach((b,i)=>{ const off=i>=stop; if(off && !b.disabled){ b.value=''; vals[i]=''; } b.disabled=off; b.placeholder=off?'—':''; });
    for(let i=stop;i<vals.length;i++) vals[i]='';
    onChange && onChange(rd); };
  boxes.forEach((b,i)=>{ b.oninput=sync; b.onblur=()=>{ const n=num(b.value); if(n!=null){ b.value=fmt(n); vals[i]=b.value; } };
    b.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const nx=boxes.slice(i+1).find(x=>!x.disabled); if(nx && !(num(b.value)!=null && a.target && num(b.value)>=a.target)) nx.focus(); else document.querySelector(`[data-bxsave="${key}"]`)?.click(); } }; });
  sync();
}

  if(!T.players.length || !T.arenas.length){ m.innerHTML='<div class="panel">Add players and machines first, or link this tournament to Matchplay on the Tournaments tab.</div>'; return; }
  const players=[...T.players].sort((a,b)=>a.name.localeCompare(b.name));
  const slot = F.playerId ? nextSlot(F.playerId) : null, live = F.playerId && playingGame(F.playerId);
  let slotTxt='';
  if(F.editingId) slotTxt='<div class="slot">Editing a saved game</div>';
  else if(live) slotTxt=`<div class="slot warn">Playing ${esc(A(live.arenaId)?.name||'')} now and entering their own scores</div>`;
  const bonusA = !F.editingId && !live && slot && slot.kind==='bonus' ? bonusArena(slot.idx) : null;
  if(bonusA && F.arenaId!==bonusA.id) F.arenaId=bonusA.id;
  if(F.editingId || live){}
  else if(slot && slot.kind==='bonus') slotTxt = bonusA ? `<div class="slot">Frame ${T.frames+1+slot.idx}: bonus frame on ${esc(bonusA.name)}, the same machine for everyone</div>` : `<div class="slot warn">Frame ${T.frames+1+slot.idx} needs a bonus machine. Draw one on the Machines tab.</div>`;
  else if(slot) slotTxt = slot.kind==='frame' ? `<div class="slot">Frame ${slot.n} of ${T.frames}</div>` : '<div class="slot warn">This player has finished their card</div>';
  const played=F.playerId ? playedArenaIds(F.playerId, F.editingId) : new Set();

  const a=A(F.arenaId);
