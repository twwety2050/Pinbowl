// Staff enter a game as the score after each ball; balls after the one that reached the target are greyed out
function ballsFromRecord(r, a){
  if(!r) return [];
  if(Array.isArray(r.balls) && r.balls.length) return r.balls.map(fmt);
  const t=a&&a.target||0, out=[];
  if(r.hitBall===1){ out.push(fmt(r.b1!=null?r.b1:t)); return out; }
  if(r.b1!=null) out.push(fmt(r.b1));
  const end = r.hitBall>=2 ? r.hitBall : (a&&a.balls||3), last = r.final!=null ? r.final : (r.hitBall>=2 ? t : r.b1);
  while(out.length<end-1) out.push(fmt(r.b1));
  if(last!=null) out.push(fmt(last));
  return out;
}
function ballRead(a, vals){
  const n=a&&a.balls||3, nums=[]; let hit=0, err='';
  for(let i=0;i<n;i++){ const v=num(vals[i]); if(v==null) break; if(nums.length && v<nums[nums.length-1]){ err=`Ball ${i+1}'s score is lower than ball ${i}'s.`; break; } nums.push(v); if(a.target && v>=a.target){ hit=i+1; break; } }
  const done = !err && nums.length && (hit>0 || nums.length>=n);
  const hitBall = hit && hit<=spareLast(a) ? hit : 0;
  return {nums, hit, done, err, hitBall, b1:nums[Math.min(strikeLast(a)-1, nums.length-1)], final:nums[nums.length-1], n, a};
}
function ballBoxesHTML(a, vals, key){
  const n=a&&a.balls||3, rd=ballRead(a, vals), stop=rd.hit||99;
  return `<div class="bbox" style="--n:${n}">${Array.from({length:n},(_,i)=>{ const off=i>=stop; return `<div><label for="${key}${i}">Ball ${i+1}</label><input type="text" inputmode="numeric" id="${key}${i}" data-bx="${key}" data-bi="${i}" value="${off?'':esc(vals[i]||'')}" ${off?'disabled placeholder="—"':''} autocomplete="off"></div>`; }).join('')}</div>`;
}
function ballVerdict(a, rd){
  if(rd.err) return `<span class="err">${esc(rd.err)}</span>`;
  if(!rd.nums.length) return '';
  const t=a.target, first=pins(rd.b1,t), pct=v=>Math.min(100,Math.floor(v*100/t)), fb=a.em?'balls 1–2':'ball 1';
  if(rd.hit && rd.hit<=strikeLast(a)) return `<span class="big">X</span><br>Strike on ball ${rd.hit}: 10 pins plus the next two throws.`;
  if(rd.hitBall>strikeLast(a)) return `<span class="big">${first||'–'} /</span><br>${first} pins on ${fb} (${pct(rd.b1)}%), then a spare on ball ${rd.hitBall}.`;
  const tot=Math.max(first,pins(rd.final,t));
  if(!rd.done) return a.em && rd.nums.length<2 ? `${pct(rd.nums[0])}% after ball 1. <span class="note">EM machine: the first throw counts after ball 2.</span>` : `${first} pins on ${fb} (${pct(rd.b1)}%)${rd.nums.length>strikeLast(a)?`, ${tot} pins so far (${pct(rd.final)}%)`:''}. <span class="note">Game not finished yet.</span>`;
  return `<span class="big">${first||'–'} ${tot-first||'–'}</span><br>${first} pins on ${fb} (${pct(rd.b1)}%), ${tot} pins for the game (${pct(rd.final)}%).`;
}
// keep greying-out live while typing, without redrawing the page
function bindBallBoxes(key, a, vals, onChange){
  const boxes=$$(`[data-bx="${key}"]`);
  const sync=()=>{ boxes.forEach((b,i)=>{ if(!b.disabled) vals[i]=b.value; }); const rd=ballRead(a, vals), stop=rd.hit||99;
    boxes.forEach((b,i)=>{ const off=i>=stop; if(off && !b.disabled){ b.value=''; vals[i]=''; } b.disabled=off; b.placeholder=off?'—':''; });
    for(let i=stop;i<vals.length;i++) vals[i]='';
    onChange && onChange(rd); };
  boxes.forEach((b,i)=>{ b.oninput=sync; b.onblur=()=>{ const n=num(b.value); if(n!=null){ b.value=fmt(n); vals[i]=b.value; } };
    b.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const nx=boxes.slice(i+1).find(x=>!x.disabled); if(nx && !(num(b.value)!=null && a.target && num(b.value)>=a.target)) nx.focus(); else document.querySelector(`[data-bxsave="${key}"]`)?.click(); } }; });
  sync();
}

// The machine as staff should enter it: a bonus game that needs just one more throw only has
// the first-throw balls (ball 1, or balls 1-2 on an EM machine)
function oneThrowNow(){ if(!F.playerId) return false; if(F.editingId){ const g=T.games.find(x=>x.id===F.editingId); return !!(g&&g.oneThrow); } const s=nextSlot(F.playerId); return s.kind==='bonus' && scorePlayer(F.playerId).stillNeeded===1; }
function entryArena(){ const a=A(F.arenaId); return a && oneThrowNow() ? {...a, balls:strikeLast(a)} : a; }
function validate(){
  if(!F.playerId) return {err:'Choose a player.'};
  if(!F.arenaId) return {err:'Choose a machine.'};
  const a=A(F.arenaId);
  if(!a.target) return {err:`Set a target score for ${a.name} on the Machines tab.`};
  if(!F.editingId){
    if(playingGame(F.playerId)) return {err:`${P(F.playerId).name} has a game in progress. Let them finish it, or delete it on their card.`};
    const slot=nextSlot(F.playerId);
    if(slot.kind==='done') return {err:`${P(F.playerId).name} has finished their card.`};
    if(slot.kind==='frame' && !T.allowRepeats && playedArenaIds(F.playerId).has(F.arenaId)) return {err:`${P(F.playerId).name} already played ${a.name}.`};
  }
  const rd=ballRead(entryArena(), F.balls);
  if(rd.err) return {err:rd.err};
  if(!rd.nums.length) return {err:'Enter the score after ball 1.'};
  if(!rd.done) return {err:`Enter every ball, or stop at the ball that reached the target. ${ballVerdict(a, rd).replace(/<[^>]+>/g,'')}`};
  return {g:{playerId:F.playerId, arenaId:F.arenaId, balls:rd.nums, hitBall:rd.hitBall, b1:rd.b1, final:rd.final}, text:ballVerdict(entryArena(), rd)};
}
function updatePreview(){ const v=validate(); $('#preview').innerHTML = v.err ? `<span class="err">${esc(v.err)}</span>` : v.text; }
async function saveGame(){

}

function weekStatusHTML(cur){
  if(!cur || cur.daily || cur.finals || readOnly()) return '';
  const noT=cur.arenas.filter(a=>a.active && !a.target).length, {reg,c}=catMix(), mixOk=!c.none && reg.length===cur.frames && [c.classic,c.mid,c.modern].sort().join('/')==='3/3/4';
  const n=cur.players.length, done=cur.players.filter(p=>scorePlayer(p.id).complete).length, started=cur.players.filter(p=>scorePlayer(p.id).regCount>0 || playingGame(p.id)).length;
  const fin=LIST.find(t=>t.id===cur.finalsId);
  const item=(state,text,tab2)=>`<li class="ws ${state}"><span class="wsi" aria-hidden="true">${state==='ok'?'✓':state==='warn'?'!':'•'}</span><span>${text}</span>${tab2?`<button class="linkbtn" data-ws="${tab2}">Open</button>`:''}</li>`;
  const items=[
    item(cur.mpId?'ok':'todo', cur.mpId?'Linked to Matchplay, new sign-ups arrive by themselves':'Not linked to Matchplay: add players and machines by hand', cur.mpId?null:'players'),
    item(noT?'warn':(cur.tenthBonus && !mixOk)?'warn':'ok', noT?`${noT} machine${noT===1?' needs':'s need'} a target score before anyone can play ${noT===1?'it':'them'}`:(cur.tenthBonus && !mixOk)?'Machines have targets. For bonus frames, use 3 Classic, 3 Mid and 4 Modern (or 3/4/3)':`${reg.length} machines ready with targets`, 'machines'),

    item(done===n && n?'ok':started?'todo':'todo', n?`Qualifying: ${done} of ${n} cards complete${started>done?`, ${started-done} in progress`:''}`:'Qualifying has not started', 'standings'),
    item(fin?'ok':cur.done?'todo':'todo', fin?'Finals made. Run them on the Finals tab':cur.done?'Marked done. Next: make the finals':`When qualifying ends: mark as done, then make the finals (top ${cutCount(cur)})`, 'finals'),

  return `<div class="panel"><h2>This week at a glance</h2><ul class="wslist">${items.join('')}</ul></div>`;

  if($('#dOpen')) $('#dOpen').onclick=async()=>{ store.set('pb-tid-at',Date.now()); await loadT(run.id); go('standings'); };
  if($('#dEnd')) $('#dEnd').onclick=async()=>{ if(!confirm('End the challenge now? Scores lock and the highest total wins.')) return;
    try{ const j=await api('/api/admin/daily/end','POST',{id:run.id}); if(T && T.id===run.id) T=j.tournament; adminSettings=null; await refreshList(); toast('Challenge ended'); renderTournaments(); }catch(e){ toast(e.message); } };
  $$('[data-open]').forEach(b=>b.onclick=async()=>{ store.set('pb-tid-at',Date.now()); await loadT(b.dataset.open); resetForm(false); render(); });
  if(!cur) return;
  if($('#ifpaGo')) $('#ifpaGo').onclick=()=>{ IFPA={tid:cur.id, data:null}; screen='ifpa'; render(); scrollTo(0,0); };
  if(readOnly()){
    $('#reopen').onclick=async()=>{ if(confirm('Reopen this tournament so scores can be changed?')){ await change('','PATCH',{status:'active'},'Reopened'); await refreshList(); render(); } };
    $('#tdel').onclick=async()=>{ if(prompt('Type DELETE to permanently delete this tournament and all its scores.')==='DELETE'){ try{ await api(`/api/admin/t/${cur.id}`,'DELETE'); store.del('pb-tid'); await boot(); toast('Deleted'); }catch(e){ toast(e.message); } } };
  } else {
    $('#tsave').onclick=async()=>{ await change('','PATCH', cur.finals ? {name:$('#tname').value, noRepeatPicks:$('#tnrp').checked} : {name:$('#tname').value, mp:$('#tmp').value, frames:Number($('#tfr').value), tenthBonus:$('#ttb').checked, allowRepeats:$('#trp').checked, ...($('#tnrp')?{noRepeatPicks:$('#tnrp').checked}:{})},'Settings saved'); await refreshList(); render(); };
    $('#tarch').onclick=async()=>{ if(confirm('Archive this tournament? Scores will be locked.')){ await change('','PATCH',{status:'archived'},'Archived'); await refreshList(); render(); } };
  }
  if($('#raw')) api(`/api/admin/t/${cur.id}/raw`).then(j=>{ const el=$('#raw'); if(el) el.textContent=Object.keys(j).length?JSON.stringify(j,null,2):'Nothing fetched yet.'; }).catch(()=>{});
}

/* ================= admin: totals ================= */
function renderTotals(){
  if(T.finals) return renderFinalsTotals();
  const N=T.frames, rows=standings();
  const pts=r=>Array.from({length:N},(_,k)=>r.frames[k]?r.frames[k].pts:'');
  $('#main').innerHTML=`<div class="panel"><h2>Totals for Matchplay</h2>
    <p class="note">Matchplay's API is read-only, so these can't be sent back automatically. In a Matchplay pinbowling tournament, type each frame's points into the matching frame. Bonuses are already included, so Matchplay's total will match.</p>
    ${T.mpId?`<p style="margin-top:.5rem"><a href="https://app.matchplay.events/tournaments/${T.mpId}" target="_blank" rel="noopener">Open this tournament in Matchplay</a></p>`:''}
    <div class="row" style="margin:.7rem 0"><button class="btn" id="cpAll">Copy all totals</button><button class="btn" id="csv">Download CSV</button></div>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th>${Array.from({length:N},(_,k)=>`<th class="n">${k+1}</th>`).join('')}<th class="n">Total</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.p.name)}${x.r.complete?'':' <span class="tag">in progress</span>'}</td>${pts(x.r).map((v,k)=>`<td class="n">${v===''?'':(x.r.frames[k].resolved?v:v+'…')}</td>`).join('')}<td class="n"><b>${x.r.total}</b></td><td><button class="btn small" data-cp="${x.p.id}">Copy</button></td></tr>`).join('')}
    </tbody></table></div><p class="note">A “…” means the frame is still waiting on bonus throws.</p></div>`;
  const copy=async txt=>{ try{ await navigator.clipboard.writeText(txt); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } toast('Copied'); };
  $('#cpAll').onclick=()=>copy(rows.map(x=>`${x.p.name}\t${x.r.total}`).join('\n'));
  $$('[data-cp]').forEach(b=>b.onclick=()=>copy(pts(rows.find(x=>x.p.id===b.dataset.cp).r).join('\t')));
  $('#csv').onclick=()=>{ const q=s=>`"${String(s).replace(/"/g,'""')}"`;
    const lines=[['Place','Player','Matchplay player ID',...Array.from({length:N},(_,k)=>`Frame ${k+1}`),'Total','Complete'].map(q).join(',')]
      .concat(rows.map(x=>[x.rank,x.p.name,x.p.mpId??'',...pts(x.r),x.r.total,x.r.complete?'yes':'no'].map(q).join(',')));
    const blob=new Blob([lines.join('\n')],{type:'text/csv'}), u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=`${T.name.replace(/[^\w-]+/g,'-')}-totals.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); };
}

/* ================= admin: admins ================= */
async function renderAdmins(){
  try{ adminSettings=await api('/api/admin/settings'); }catch(e){ toast(e.message); return; }
  $('#main').innerHTML=`<div class="panel"><h2>Admins</h2>
    <p class="note">Admins can enter and edit anyone's scores, manage machines and players, and run tournaments.</p>
    <div class="tablewrap" style="margin-top:.6rem"><table><tbody>
    ${adminSettings.admins.map(a=>`<tr><td>${esc(a.name)}${a.id===ADMIN.id?' <span class="tag">you</span>':''}</td><td class="n">${a.id===ADMIN.id?'':`<button class="btn small" data-pw="${a.id}">Reset password</button> <button class="btn small danger" data-rmadm="${a.id}">Remove</button>`}</td></tr>`).join('')}
    </tbody></table></div>
    <h3>Add an admin</h3>
    <p class="note">Give them the name and password below. They can change the password after logging in.</p>
    <div class="row"><div class="grow"><label for="an">Name</label><input type="text" id="an" list="pnames"></div><div class="grow"><label for="ap">Temporary password</label><input type="text" id="ap" autocomplete="off"></div><button class="btn" id="aGo">Add admin</button></div>
    <datalist id="pnames">${(T?T.players:[]).map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
    <h3>Change my password</h3>
    <div class="row"><div class="grow"><input type="password" id="mypw" placeholder="New password" autocomplete="new-password"></div><button class="btn" id="mypwGo">Change password</button></div></div>`;
  $('#aGo').onclick=async()=>{ try{ await api('/api/admin/admins','POST',{name:$('#an').value,password:$('#ap').value}); toast('Admin added'); renderAdmins(); }catch(e){ toast(e.message); } };
  $('#mypwGo').onclick=async()=>{ try{ await api(`/api/admin/admins/${ADMIN.id}/password`,'PUT',{password:$('#mypw').value}); toast('Password changed'); $('#mypw').value=''; }catch(e){ toast(e.message); } };
  $$('[data-rmadm]').forEach(b=>b.onclick=async()=>{ if(!confirm('Remove this admin?')) return; try{ await api(`/api/admin/admins/${b.dataset.rmadm}`,'DELETE'); toast('Admin removed'); renderAdmins(); }catch(e){ toast(e.message); } });
  $$('[data-pw]').forEach(b=>b.onclick=async()=>{ const pw=prompt('New password for this admin (6 or more characters):'); if(!pw) return; try{ await api(`/api/admin/admins/${b.dataset.pw}/password`,'PUT',{password:pw}); toast('Password reset'); }catch(e){ toast(e.message); } });
}

/* ================= small choice dialog ================= */
// askChoice('Title','Text',[['keep','Keep them','primary'],['delete','Delete them','danger']]) resolves to the key, or null for Cancel
function askChoice(title, text, choices){
  return new Promise(res=>{ const d=$('#invite');
    d.innerHTML=`<div class="sharecard" role="dialog" aria-modal="true" aria-labelledby="chh"><h2 id="chh" style="font:700 1.35rem var(--cond);color:var(--ink)">${esc(title)}</h2><p>${text}</p>
      <div class="row" style="justify-content:center">${choices.map(([k,l,c])=>`<button class="btn ${c||''}" data-ch="${k}">${esc(l)}</button>`).join('')}<button class="btn" data-ch="">Cancel</button></div></div>`;
    d.hidden=false; const done=v=>{ d.hidden=true; d.innerHTML=''; res(v); };
    d.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>done(b.dataset.ch||null)); d.onclick=e=>{ if(e.target===d) done(null); };
    d.querySelector('[data-ch]').focus(); });
}

/* ================= finals invite ================= */
// When finals are made, everyone who made them gets a prompt to open them (once per finals).
const FINALIST={};
async function openFinals(id){ store.set('pb-finseen-'+id,'1'); $('#invite').hidden=true; store.set('pb-tid-at',Date.now()); await loadT(id); screen=null; tab='finals'; store.set('pb-tab-p','finals'); render(); window.scrollTo(0,0); }
async function checkFinalsInvite(){
  if(!PLAYER || TVMODE || STREAMMODE || screen) return;
  for(const t of LIST.filter(x=>x.finals && x.status==='active')){
    if(FINALIST[t.id]===undefined){ try{ const F=await api('/api/t/'+t.id); FINALIST[t.id]=F.players.some(p=>p.name.toLowerCase()===PLAYER.name.toLowerCase()); }catch(e){ continue; } }
    if(!FINALIST[t.id]) continue;
    renderHeader();
    if((T && T.id===t.id) || store.get('pb-finseen-'+t.id) || !$('#invite').hidden) continue;
    const d=$('#invite');
    d.innerHTML=`<div class="sharecard" role="dialog" aria-modal="true" aria-labelledby="invh"><h2 id="invh">You made the finals!</h2>
      <p><b>${esc(t.name)}</b> ${t.name.toLowerCase().includes('finals')?'is':'finals are'} ready. Open it to see your group, pick games or your position when it's your turn, and enter your scores.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="invGo">Open the finals</button><button class="btn" id="invLater">Later</button></div></div>`;
    d.hidden=false; try{ navigator.vibrate && navigator.vibrate([150,80,150]); }catch(e){}
    $('#invGo').onclick=()=>openFinals(t.id);
    $('#invLater').onclick=()=>{ store.set('pb-finseen-'+t.id,'1'); d.hidden=true; toast('You can open the finals any time from the banner or the tournament menu at the top.'); };
    $('#invGo').focus();
    break;
  }
}
setInterval(async()=>{ if(document.hidden || !PLAYER || TVMODE || STREAMMODE) return; try{ await refreshList(); await checkFinalsInvite(); }catch(e){} }, 15000);

/* ================= loading and live updates ================= */
async function refreshList(){ const s=await api('/api/state'); LIST=s.tournaments; ADMIN=s.admin; PLAYER=s.player; NEEDS_SETUP=s.needsSetup; }
async function loadT(id){ try{ T=await api('/api/t/'+id); store.set('pb-tid',id); }catch(e){ T=null; } }
async function boot(){
  try{ await refreshList(); }catch(e){ $('#main').innerHTML='<div class="panel err">Could not reach the server. Check your connection and reload.</div>'; return; }
  if(TVMODE || STREAMMODE){ document.body.classList.add(STREAMMODE?'streammode':'tvmode'); const id=bcPickId(); T=null; if(id) T=await api('/api/t/'+id).catch(()=>null); return render(); }
  if(NEEDS_SETUP){ screen='setup'; render(); return; }
  const pickId = pickDefaultId();
  T=null; if(pickId) await loadT(pickId);
  const valid=tabs().map(x=>x[0]);
  if(!valid.includes(tab)){ const s=store.get('pb-tab-'+(ADMIN?'a':'p')); tab=valid.includes(s)?s:valid[0]; }
  render(); checkFinalsInvite();
}
setInterval(async()=>{
  if(document.hidden || screen || !T || !T.finals || T.status!=='active' || TVMODE || STREAMMODE || !['finals','standings'].includes(tab)) return;
  try{
    const fresh=await api('/api/t/'+T.id); if(JSON.stringify(fresh)===JSON.stringify(T)) return;
    T=fresh;
    const mf=myFinals(), myTurn=!!(mf && ((mf.picking==='games' && mf.picker===mf.me && !gWaitFor(mf.round,mf.g)) || (mf.picking==='pos' && mf.turn===mf.me)));
    if(myTurn && LASTTURN!==true){ toast("It's your turn to pick!"); try{ navigator.vibrate && navigator.vibrate(200); }catch(e){} }
    LASTTURN=myTurn;
    const typing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
    if(!typing && FED==null && PFX==null && !PFS){ const y=window.scrollY; tab==='standings'?renderFinalsStandings():renderFinals(); window.scrollTo(0,y); }
  }catch(e){}
}, 8000);
setInterval(async()=>{
  if(document.hidden || screen || !T || T.status!=='active' || TVMODE || tab==='tv') return;
  try{
    const fresh=await api('/api/t/'+T.id); const changed=JSON.stringify(fresh)!==JSON.stringify(T);
    T=fresh;
    if(ADMIN || PLAYER){ const was=isKeeper(); await refreshList(); if(was!==isKeeper()){ if(!tabs().some(x=>x[0]===tab)) tab='mine'; render(); return; } }
    const typing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
    const openIds=$$('details[open]').map(d=>d.dataset.pid||d.dataset.mid||'');
    const busy = typing || ((tab==='enter'||tab==='play') && formDirty()) || ['tournaments','admins','players','stored','stats','finals'].includes(tab) || !$('#shareBox').hidden;
    if(changed && !busy){
      const y=window.scrollY; render(); $$('details[data-pid]').forEach(d=>{ d.open=openIds.includes(d.dataset.pid); }); $$('details[data-mid]').forEach(d=>{ d.open=openIds.includes(d.dataset.mid); }); window.scrollTo(0,y);
    }
  }catch(e){}
}, 20000);
if(QS.get('sheet')==='cards') renderCards(); else if(QS.has('sheet')) renderSheet(); else if(STREAMMODE && QS.get('view')==='machine') machineWindow(); else boot();
</script>
